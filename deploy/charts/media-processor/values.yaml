---
config:
  hatchetToken:
    value: ""
    secretKeyRef:
      name: ""
      key: ""

  # inputVolume is a bjw-s persistence item (type, existingClaim, etc.) without globalMounts or
  # advancedMounts; the chart manages mounts at /media/input. An optional chart-specific subPath
  # field controls the volume mount subPath. When empty, no input volume is created.
  inputVolume: {}
  # inputVolume:
  #   type: nfs
  #   server: nas.example.com
  #   path: /volume1/media
  #   subPath: input

  watcher:
    # configType controls whether the watcher YAML config file is stored as a ConfigMap or Secret.
    configType: ConfigMap
    # schedule is the 6-field Hatchet cron expression (seconds-leading) for the watcher scan.
    schedule: ""
    watches: []
    logLevel: info
    metrics:
      enabled: false
      otel:
        endpoint: ""

  worker:
    logLevel: info
    metrics:
      enabled: false
      otel:
        endpoint: ""
      highCardinalityLabels: false
    media:
      output:
        # volume is a bjw-s persistence item without globalMounts or advancedMounts; the chart
        # manages mounts at /media/output. An optional subPath field controls the mount subPath.
        # When empty, no output volume is created.
        volume: {}
        # volume:
        #   type: nfs
        #   server: nas.example.com
        #   path: /volume1/media
        #   subPath: output
        # radarrRemoteMountPath is how Radarr sees the output directory. When non-empty,
        # RADARR_LOCAL_PATH_PREFIX and RADARR_REMOTE_PATH_PREFIX are set on the worker.
        radarrRemoteMountPath: ""
        # sonarrRemoteMountPath is how Sonarr sees the output directory. When non-empty,
        # SONARR_LOCAL_PATH_PREFIX and SONARR_REMOTE_PATH_PREFIX are set on the worker.
        sonarrRemoteMountPath: ""
      webhookUrl: ""
      hardware:
        # devicePath is the host path to the hardware encoding device (e.g. /dev/dri/renderD128).
        # When non-empty, MEDIA_HARDWARE_DEVICE_PATH is set on the worker.
        devicePath: ""
        # mountHostDevice, when true and devicePath is set, creates a hostPath volume mounting
        # the device inside the container at the same path. Set to false when using a device
        # plugin or DRA.
        mountHostDevice: true
      blackBarRemoval:
        minimumPixels:
          horizontal: 10
          vertical: 10
        detectTimeout: "30m"
      transcode:
        timeout: "4h"
        videoQuality: ""
    radarr:
      url: ""
      apiKey:
        value: ""
        secretKeyRef:
          name: ""
          key: ""
    sonarr:
      url: ""
      apiKey:
        value: ""
        secretKeyRef:
          name: ""
          key: ""

# resources follows the bjw-s app-template schema. Values here are deep-merged over the
# chart-computed env vars and persistence; user-supplied values take precedence.
resources:
  controllers:
    watcher:
      strategy: RollingUpdate
      containers:
        watcher:
          image:
            repository: ghcr.io/soliddowant/watcher
            tag: "{{ .Chart.AppVersion }}"
          args:
            - --config
            - /etc/media-processor/watcher.yaml
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz
                  port: 8081
                initialDelaySeconds: 0
                periodSeconds: 10
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /readyz
                  port: 8081
                initialDelaySeconds: 0
                periodSeconds: 10
                failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
      podDisruptionBudget:
        enabled: '{{ gt ((index .Values "resources" "controllers" "watcher" "replicas" | default 1) | int) 1 }}'
        minAvailable: 1
    worker:
      strategy: RollingUpdate
      containers:
        worker:
          image:
            repository: ghcr.io/soliddowant/worker
            tag: "{{ .Chart.AppVersion }}"
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz
                  port: 8080
                initialDelaySeconds: 0
                periodSeconds: 10
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /readyz
                  port: 8080
                initialDelaySeconds: 0
                periodSeconds: 10
                failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
      podDisruptionBudget:
        enabled: '{{ gt ((index .Values "resources" "controllers" "worker" "replicas" | default 1) | int) 1 }}'
        minAvailable: 1
      # DRA GPU example (requires config.worker.media.hardware.mountHostDevice: false):
      # pod:
      #   resourceClaims:
      #     - name: gpu
      #       resourceClaimName: my-gpu-claim
      # containers:
      #   worker:
      #     resources:
      #       claims:
      #         - name: gpu
  defaultPodOptions:
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
  service:
    watcher-metrics:
      enabled: '{{ .Values.config.watcher.metrics.enabled }}'
      controller: watcher
      ports:
        metrics:
          port: 9090
          protocol: TCP
    worker-metrics:
      enabled: '{{ .Values.config.worker.metrics.enabled }}'
      controller: worker
      ports:
        metrics:
          port: 9090
          protocol: TCP
  serviceMonitor:
    watcher:
      enabled: '{{ .Values.config.watcher.metrics.enabled }}'
      service:
        identifier: watcher-metrics
      endpoints:
        - port: metrics
          scheme: http
          path: /metrics
          interval: 1m
          scrapeTimeout: 10s
    worker:
      enabled: '{{ .Values.config.worker.metrics.enabled }}'
      service:
        identifier: worker-metrics
      endpoints:
        - port: metrics
          scheme: http
          path: /metrics
          interval: 1m
          scrapeTimeout: 10s