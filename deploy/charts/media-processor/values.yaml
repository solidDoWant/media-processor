---
config:
  # temporal selects the Temporal frontend the watcher and worker connect to. address is required
  # and helm template fails when empty; namespace and taskQueue have sensible defaults.
  #
  # Non-secret fields (address, namespace, tls.*, grpcMeta) are rendered into a temporal.toml
  # ConfigMap consumed by the Temporal Go SDK envconfig package. Secret material (apiKey, TLS
  # cert/key/CA bytes) comes from k8s Secrets, surfaced as either env vars or mounted files.
  temporal:
    # address is the Temporal frontend host:port (no scheme). Written to address in the rendered
    # temporal.toml. Example: "temporal-frontend.temporal.svc.cluster.local:7233".
    address: ""
    # namespace is the Temporal namespace the workflows execute in. Written to namespace in the
    # rendered temporal.toml. Defaults to Temporal's built-in "default" namespace.
    namespace: "default"
    # taskQueue is the Temporal task queue the worker polls and the watcher dispatches to. Sets
    # TEMPORAL_TASK_QUEUE on both watcher and worker. Not a Temporal client option, so it stays
    # an env var rather than going into temporal.toml.
    taskQueue: "media-processor"
    # apiKey is the Temporal Cloud / authenticated frontend API key. Sets TEMPORAL_API_KEY on
    # both watcher and worker. Use secretKeyRef in production; value is intended for dev only.
    # Setting both is rejected. When both name and key under secretKeyRef are empty, no API key
    # env var is set.
    #
    # File-mounted keys: a value of the form "file:///absolute/path" tells the binary to read
    # the API key from disk on every Temporal RPC, picking up external rotators (Vault Agent,
    # external-secrets refresh, etc.) without a process restart. To use this, mount the
    # backing Secret yourself via the resources.controllers.{watcher,worker}.{persistence,…}
    # passthrough and set apiKey.value to the resulting in-container path with the file://
    # prefix. The path must be absolute.
    apiKey:
      value: ""
      secretKeyRef:
        name: ""
        key: ""
    # tls configures transport security to the Temporal frontend. enabled: false uses
    # plaintext gRPC; this holds even when apiKey is set, so a dev frontend that accepts
    # a token over plaintext keeps working. enabled: true turns on server-side TLS; mTLS
    # and a custom CA are optional, configured via the cert references below. Each
    # reference points at an existing k8s Secret (e.g. one produced by cert-manager).
    # References that share a Secret name share one volume mount.
    tls:
      enabled: false
      # serverName overrides the SNI / cert-verification hostname (TEMPORAL_TLS_SERVER_NAME).
      # Useful when address is an IP or a service name that doesn't match the cert's SAN.
      serverName: ""
      # disableHostVerification skips server certificate hostname verification. Should only be
      # used in development against self-signed certs. Maps to TEMPORAL_TLS_DISABLE_HOST_VERIFICATION.
      disableHostVerification: false
      # clientCertificate enables mTLS by pointing at a kubernetes.io/tls Secret containing the
      # client cert and private key. The Secret must have the standard "tls.crt" and "tls.key"
      # keys (cert-manager and `kubectl create secret tls` produce these by default). Leave
      # secretName empty to skip mTLS.
      clientCertificate:
        secretName: ""
      # caCert overrides the trusted CA pool. Unlike clientCertificate this is a free-form
      # secretKeyRef because CA bundles aren't standardised on a single Secret layout, but
      # key defaults to "ca.crt" (the convention used by cert-manager and most k8s tooling)
      # so usually only secretKeyRef.name needs to be set. Leave name empty to use the
      # system roots.
      caCert:
        secretKeyRef:
          name: ""
          key: "ca.crt"
    # grpcMeta is a map of gRPC metadata headers added to every Temporal RPC. Keys are passed
    # through verbatim (the Temporal SDK lowercases and hyphenates them at load time). Rendered
    # under [profile.default.grpc_meta] in temporal.toml.
    grpcMeta: {}

  # inputVolume is a bjw-s persistence item (type, existingClaim, etc.) without globalMounts or
  # advancedMounts; the chart manages mounts at /media/input. An optional chart-specific subPath
  # field controls the volume mount subPath. When empty, no input volume is created.
  inputVolume: {}
  # inputVolume:
  #   type: nfs
  #   server: nas.example.com
  #   path: /volume1/media
  #   subPath: input

  watcher:
    # configType controls whether the watcher YAML config file is stored as a ConfigMap or Secret.
    configType: ConfigMap
    # scanInterval is the duration between directory scans, as a Go duration string (e.g. "5s",
    # "1m30s"). Defaults to "5s" when empty (the watcher binary applies the default). Written to
    # scanInterval in the rendered watcher YAML config.
    scanInterval: ""
    watches: []
    # volumes is a map of volume names to bjw-s persistence items (type, existingClaim, server/path,
    # etc.) without globalMounts or advancedMounts; the chart manages mounts. Keys become bjw-s
    # persistence keys. Referenced by watch entry output.volumeName fields. Volumes not referenced
    # by any watch entry are not mounted. When empty, no output volumes are created.
    volumes: {}
    # volumes:
    #   media-output:
    #     type: nfs
    #     server: nas.example.com
    #     path: /volume1/media
    logLevel: info
    # The watcher always exposes /metrics on port 9091 regardless of this value.
    # The toggle controls whether cluster-side scraping infrastructure (the
    # watcher-metrics Service and its ServiceMonitor) is created. Leave false
    # when running without prometheus-operator CRDs installed.
    metrics:
      enabled: false
      # scrapeWaitTimeout bounds how long the watcher's metrics endpoint stays open
      # after the scan loop exits, waiting for one final Prometheus scrape. Go duration
      # string (e.g. "30s", "2m"). Sets METRICS_SCRAPE_WAIT_TIMEOUT. Must be at least
      # 2x the Prometheus scrape interval. Set to "0s" to disable. When empty, the
      # binary default of 60s applies. The chart's terminationGracePeriodSeconds (120s)
      # must accommodate this value plus a buffer.
      scrapeWaitTimeout: ""
    searchAttributes:
      # enabled controls whether the watcher attaches custom Temporal search attributes
      # to dispatched media workflows. Sets WATCHER_TEMPORAL_SEARCH_ATTRIBUTES_ENABLED
      # on the watcher container. When true (the default), the four custom search
      # attributes (MediaFilePathSegments, MediaTitle, MediaType, MediaMappingName)
      # must be pre-registered in the Temporal namespace. See docs/configuration.md
      # for the registration command. Set to false when running against a Temporal
      # server without advanced visibility configured.
      enabled: true

  worker:
    logLevel: info
    # stopTimeout bounds the SIGTERM-triggered drain of in-flight Temporal activities, as a
    # Go duration string (e.g. "30m", "2h"). Sets WORKER_STOP_TIMEOUT on the worker. The
    # chart default of 30s pairs with METRICS_SCRAPE_WAIT_TIMEOUT (60s) and a 30s buffer
    # to fit within the 120s terminationGracePeriodSeconds. Operators running long
    # transcodes must raise this together with config.worker.metrics.scrapeWaitTimeout
    # and the worker's pod.terminationGracePeriodSeconds. When empty, the binary default
    # (the effective MEDIA_TRANSCODE_TIMEOUT, normally 4h) applies.
    stopTimeout: "30s"
    # The worker always exposes /metrics on port 9090 regardless of this value.
    # The toggle controls whether cluster-side scraping infrastructure (the
    # worker-metrics Service and its PodMonitor) is created. Leave false when
    # running without prometheus-operator CRDs installed.
    metrics:
      enabled: false
      highCardinalityLabels: false
      # scrapeWaitTimeout bounds how long the worker's metrics endpoint stays open
      # after activity drain completes, waiting for one final Prometheus scrape. Go
      # duration string (e.g. "30s", "2m"). Sets METRICS_SCRAPE_WAIT_TIMEOUT. Must be
      # at least 2x the Prometheus scrape interval. Set to "0s" to disable. When empty,
      # the binary default of 60s applies. Together with stopTimeout this must fit
      # within the worker's pod.terminationGracePeriodSeconds (120s) plus a buffer.
      scrapeWaitTimeout: ""
    media:
      webhookUrl: ""
      hardware:
        # devicePath is the host path to the hardware encoding device (e.g. /dev/dri/renderD128).
        # When non-empty, MEDIA_HARDWARE_DEVICE_PATH is set on the worker, which uses it
        # verbatim and skips auto-detection. When empty (the default), transcode-enabled
        # workers auto-detect an Intel i915 render node under /sys/class/drm/.
        devicePath: ""
        # mountHostDevice, when true and devicePath is set, creates a hostPath volume mounting
        # the device inside the container at the same path. Set to false when using a device
        # plugin or DRA.
        mountHostDevice: true
      blackBarRemoval:
        minimumPixels:
          horizontal: 10
          vertical: 10
        detectTimeout: "30m"
      transcode:
        timeout: "4h"
        videoQuality: ""
        # progressLogInterval sets MEDIA_PROGRESS_LOG_INTERVAL on the worker as a Go
        # duration string (e.g. "1m", "5m"). Controls how often a transcode progress
        # log line is emitted, and also drives the transcode activity's Temporal
        # HeartbeatTimeout (set to 2x this value), so a stuck encode is detected and
        # failed within roughly twice this interval rather than waiting for the full
        # MEDIA_TRANSCODE_TIMEOUT. Set to "0s" to disable both progress logging and
        # heartbeat-based stall detection. When empty, the binary default of 30s applies.
        progressLogInterval: ""
    radarr:
      url: ""
      apiKey:
        value: ""
        secretKeyRef:
          name: ""
          key: ""
    sonarr:
      url: ""
      apiKey:
        value: ""
        secretKeyRef:
          name: ""
          key: ""

# workers is a map of worker controller name → per-worker app config. Each entry
# represents one Deployment that polls a configurable subset of activity task
# queues.
#
# When this map is empty (the chart default), the chart implicitly defines a
# single controller named "main" with activities: [all], behaviorally equivalent
# to the pre-multi-worker chart. As soon as at least one entry is supplied (via
# values file or --set), the implicit "main" entry is NOT added — operators
# fully control the worker set. To keep "main" alongside additional workers,
# include it explicitly.
#
# Per-worker keys (currently):
#   activities — list of WORKER_ACTIVITIES tokens. "all" expands to every known
#     activity; "!name" removes one. Examples: ["all"], ["all", "!transcode"],
#     ["transcode"]. The chart sets WORKER_ACTIVITIES on the worker as a
#     comma-joined string. See docs/configuration.md#activity-task-queues.
#
# Kubernetes-level configuration for a worker (replicas, resources, node
# selectors, tolerations, pod spec overrides) is supplied via
# resources.controllers.<name> using the upstream bjw-s app-template schema and
# is deep-merged over the chart-generated controller defaults. The container
# inside each worker controller is named "main" regardless of the worker key.
#
# Example split-worker setup:
# workers:
#   general:
#     activities: ["all", "!transcode"]
#   transcode:
#     activities: ["transcode"]
workers: {}

# resources follows the bjw-s app-template schema. Values here are deep-merged over the
# chart-computed env vars and persistence; user-supplied values take precedence.
#
# Worker controllers (one per workers.<name> entry) are generated by the chart
# template — there are no static worker controller defaults under
# resources.controllers in this file. Override individual worker controllers by
# adding resources.controllers.<workerName> with the standard bjw-s controller
# schema (replicas, pod, containers.main, etc.).
#
# Controller `type` selects the rendered Kubernetes kind. The chart accepts
# bjw-s' supported types (`deployment` (default), `daemonset`, `statefulset`,
# `cronjob`, `job`) plus `scaledjob`, which renders a `keda.sh/v1alpha1`
# ScaledJob in place of the Deployment for that worker (KEDA must be installed
# separately). `type: scaledjob` is only valid for entries that match a
# `workers.<name>` key. Lift KEDA-level config under `resources.controllers.<name>.keda.*`
# (e.g. `pollingInterval`, `maxReplicaCount`) and Job-template config under
# `resources.controllers.<name>.job.*` (e.g. `parallelism`, `backoffLimit`).
# Scaledjob workers default `WORKER_IDLE_EXIT_AFTER` to `5m`, or `15m` if
# the worker's activities resolve to include the `workflow` token; override
# via `containers.main.env.WORKER_IDLE_EXIT_AFTER`.
resources:
  controllers:
    watcher:
      strategy: RollingUpdate
      containers:
        watcher:
          image:
            repository: ghcr.io/soliddowant/media-processor/watcher
            tag: "{{ .Chart.AppVersion }}"
          args:
            - --config
            - /etc/media-processor/watcher.yaml
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz
                  port: 8081
                initialDelaySeconds: 0
                periodSeconds: 10
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /readyz
                  port: 8081
                initialDelaySeconds: 0
                periodSeconds: 10
                failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
      podDisruptionBudget:
        enabled: '{{ gt ((index .Values "resources" "controllers" "watcher" "replicas" | default 1) | int) 1 }}'
        minAvailable: 1
      # 120s accommodates the scan-loop teardown plus the metrics scrape-wait gate
      # (binary default 60s) plus a 60s buffer before SIGKILL.
      pod:
        terminationGracePeriodSeconds: 120
    # Worker controllers (one per workers.<name> entry) are emitted by the chart
    # template. The chart-generated defaults include image, named metrics port,
    # probes (8080 health), securityContext, podDisruptionBudget, and
    # terminationGracePeriodSeconds=120 (covering config.worker.stopTimeout +
    # METRICS_SCRAPE_WAIT_TIMEOUT + buffer). Override per-worker by adding
    # resources.controllers.<name> here.
    #
    # DRA GPU example (requires config.worker.media.hardware.mountHostDevice: false):
    # transcode:
    #   pod:
    #     resourceClaims:
    #       - name: gpu
    #         resourceClaimName: my-gpu-claim
    #   containers:
    #     main:
    #       resources:
    #         claims:
    #           - name: gpu
  defaultPodOptions:
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
  service:
    watcher-metrics:
      enabled: '{{ .Values.config.watcher.metrics.enabled }}'
      controller: watcher
      ports:
        metrics:
          port: 9091
          protocol: TCP
    # Per-worker metrics services (<workerName>-metrics, controller <workerName>,
    # port 9090) are emitted by the chart template, gated by
    # config.worker.metrics.enabled.
  # The watcher uses a ServiceMonitor: its scan loop exits within milliseconds of
  # SIGTERM, so the brief delay before the pod drops out of the Endpoints object
  # does not interfere with the scrape-wait gate. The worker uses a PodMonitor
  # (under rawResources, also emitted by the template) because its activity drain
  # can run for the full WORKER_STOP_TIMEOUT, during which a ServiceMonitor would
  # lose the pod from Endpoints and break the scrape-on-shutdown gate.
  serviceMonitor:
    # suffix kept to preserve the resource name across the migration to a single
    # serviceMonitor entry (bjw-s only auto-suffixes when itemCount > 1).
    watcher:
      enabled: '{{ .Values.config.watcher.metrics.enabled }}'
      suffix: watcher
      service:
        identifier: watcher-metrics
      endpoints:
        - port: metrics
          interval: 1m
          scrapeTimeout: 10s
  # rawResources: per-worker PodMonitors (suffix=<workerName>, controller selector
  # app.kubernetes.io/controller: <workerName>) are emitted by the chart template,
  # gated by config.worker.metrics.enabled.
