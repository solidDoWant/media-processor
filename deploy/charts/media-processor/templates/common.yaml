---
{{/* ============================================================ */}}
{{/* Hard-coded chart internals (not exposed in values)           */}}
{{/* ============================================================ */}}
{{- $inputMountPath  := "/media/input" -}}
{{- $outputMountPath := "/media/output" -}}
{{- $configMountPath := "/etc/media-processor" -}}
{{- $metricsPort     := 9090 -}}

{{/* ============================================================ */}}
{{/* Image tag: evaluate tpl strings (e.g. {{ .Chart.AppVersion }}) */}}
{{/* ============================================================ */}}
{{- $wc := index .Values "resources" "controllers" "watcher" "containers" "watcher" -}}
{{- $_ := set (index $wc "image") "tag" (tpl ((index $wc "image" "tag") | default "" | toString) . | default .Chart.AppVersion) -}}
{{- $wkc := index .Values "resources" "controllers" "worker" "containers" "worker" -}}
{{- $_ := set (index $wkc "image") "tag" (tpl ((index $wkc "image" "tag") | default "" | toString) . | default .Chart.AppVersion) -}}

{{/* ============================================================ */}}
{{/* Credential secretKeyRef validation                           */}}
{{/* ============================================================ */}}
{{- $hatchetSecretName := .Values.config.hatchetToken.secretKeyRef.name | default "" -}}
{{- $hatchetSecretKey  := .Values.config.hatchetToken.secretKeyRef.key  | default "" -}}
{{- if or (and $hatchetSecretName (not $hatchetSecretKey)) (and $hatchetSecretKey (not $hatchetSecretName)) -}}
  {{- fail "config.hatchetToken.secretKeyRef.name and config.hatchetToken.secretKeyRef.key must both be set when using secretKeyRef" -}}
{{- end -}}

{{- $radarrSecretName := .Values.config.worker.radarr.apiKey.secretKeyRef.name | default "" -}}
{{- $radarrSecretKey  := .Values.config.worker.radarr.apiKey.secretKeyRef.key  | default "" -}}
{{- if or (and $radarrSecretName (not $radarrSecretKey)) (and $radarrSecretKey (not $radarrSecretName)) -}}
  {{- fail "config.worker.radarr.apiKey.secretKeyRef.name and config.worker.radarr.apiKey.secretKeyRef.key must both be set when using secretKeyRef" -}}
{{- end -}}

{{- $sonarrSecretName := .Values.config.worker.sonarr.apiKey.secretKeyRef.name | default "" -}}
{{- $sonarrSecretKey  := .Values.config.worker.sonarr.apiKey.secretKeyRef.key  | default "" -}}
{{- if or (and $sonarrSecretName (not $sonarrSecretKey)) (and $sonarrSecretKey (not $sonarrSecretName)) -}}
  {{- fail "config.worker.sonarr.apiKey.secretKeyRef.name and config.worker.sonarr.apiKey.secretKeyRef.key must both be set when using secretKeyRef" -}}
{{- end -}}

{{/* ============================================================ */}}
{{/* Watcher env vars                                             */}}
{{/* ============================================================ */}}
{{- $watcherEnv := dict -}}

{{/* HATCHET_CLIENT_TOKEN */}}
{{- if $hatchetSecretName -}}
  {{- $_ := set $watcherEnv "HATCHET_CLIENT_TOKEN" (dict "valueFrom" (dict "secretKeyRef" (dict "name" $hatchetSecretName "key" $hatchetSecretKey))) -}}
{{- else if .Values.config.hatchetToken.value -}}
  {{- $_ := set $watcherEnv "HATCHET_CLIENT_TOKEN" .Values.config.hatchetToken.value -}}
{{- end -}}

{{/* LOG_LEVEL */}}
{{- $_ := set $watcherEnv "LOG_LEVEL" .Values.config.watcher.logLevel -}}

{{/* METRICS_ADDR */}}
{{- if .Values.config.watcher.metrics.enabled -}}
  {{- $_ := set $watcherEnv "METRICS_ADDR" (printf ":%d" $metricsPort) -}}
{{- end -}}

{{/* OTEL_EXPORTER_OTLP_ENDPOINT */}}
{{- if .Values.config.metrics.otel.endpoint -}}
  {{- $_ := set $watcherEnv "OTEL_EXPORTER_OTLP_ENDPOINT" .Values.config.metrics.otel.endpoint -}}
{{- end -}}

{{/* METRICS_HIGH_CARDINALITY_LABELS */}}
{{- if .Values.config.metrics.highCardinalityLabels -}}
  {{- $_ := set $watcherEnv "METRICS_HIGH_CARDINALITY_LABELS" "true" -}}
{{- end -}}

{{/* ============================================================ */}}
{{/* Worker env vars                                              */}}
{{/* ============================================================ */}}
{{- $workerEnv := dict -}}

{{/* HATCHET_CLIENT_TOKEN */}}
{{- if $hatchetSecretName -}}
  {{- $_ := set $workerEnv "HATCHET_CLIENT_TOKEN" (dict "valueFrom" (dict "secretKeyRef" (dict "name" $hatchetSecretName "key" $hatchetSecretKey))) -}}
{{- else if .Values.config.hatchetToken.value -}}
  {{- $_ := set $workerEnv "HATCHET_CLIENT_TOKEN" .Values.config.hatchetToken.value -}}
{{- end -}}

{{/* LOG_LEVEL */}}
{{- $_ := set $workerEnv "LOG_LEVEL" .Values.config.worker.logLevel -}}

{{/* MEDIA_INPUT_ROOT */}}
{{- $_ := set $workerEnv "MEDIA_INPUT_ROOT" $inputMountPath -}}

{{/* MEDIA_OUTPUT_DIR */}}
{{- $_ := set $workerEnv "MEDIA_OUTPUT_DIR" $outputMountPath -}}

{{/* MEDIA_WEBHOOK_URL */}}
{{- if .Values.config.worker.media.webhookUrl -}}
  {{- $_ := set $workerEnv "MEDIA_WEBHOOK_URL" .Values.config.worker.media.webhookUrl -}}
{{- end -}}

{{/* MEDIA_HARDWARE_DEVICE_PATH */}}
{{- if .Values.config.worker.media.hardware.devicePath -}}
  {{- $_ := set $workerEnv "MEDIA_HARDWARE_DEVICE_PATH" .Values.config.worker.media.hardware.devicePath -}}
{{- end -}}

{{/* RADARR path vars (conditional on radarrRemoteMountPath) */}}
{{- if .Values.config.worker.media.output.radarrRemoteMountPath -}}
  {{- $_ := set $workerEnv "RADARR_LOCAL_PATH_PREFIX"  $outputMountPath -}}
  {{- $_ := set $workerEnv "RADARR_REMOTE_PATH_PREFIX" .Values.config.worker.media.output.radarrRemoteMountPath -}}
{{- end -}}

{{/* SONARR path vars (conditional on sonarrRemoteMountPath) */}}
{{- if .Values.config.worker.media.output.sonarrRemoteMountPath -}}
  {{- $_ := set $workerEnv "SONARR_LOCAL_PATH_PREFIX"  $outputMountPath -}}
  {{- $_ := set $workerEnv "SONARR_REMOTE_PATH_PREFIX" .Values.config.worker.media.output.sonarrRemoteMountPath -}}
{{- end -}}

{{/* RADARR_URL */}}
{{- if .Values.config.worker.radarr.url -}}
  {{- $_ := set $workerEnv "RADARR_URL" .Values.config.worker.radarr.url -}}
{{- end -}}

{{/* RADARR_API_KEY */}}
{{- if $radarrSecretName -}}
  {{- $_ := set $workerEnv "RADARR_API_KEY" (dict "valueFrom" (dict "secretKeyRef" (dict "name" $radarrSecretName "key" $radarrSecretKey))) -}}
{{- else if .Values.config.worker.radarr.apiKey.value -}}
  {{- $_ := set $workerEnv "RADARR_API_KEY" .Values.config.worker.radarr.apiKey.value -}}
{{- end -}}

{{/* SONARR_URL */}}
{{- if .Values.config.worker.sonarr.url -}}
  {{- $_ := set $workerEnv "SONARR_URL" .Values.config.worker.sonarr.url -}}
{{- end -}}

{{/* SONARR_API_KEY */}}
{{- if $sonarrSecretName -}}
  {{- $_ := set $workerEnv "SONARR_API_KEY" (dict "valueFrom" (dict "secretKeyRef" (dict "name" $sonarrSecretName "key" $sonarrSecretKey))) -}}
{{- else if .Values.config.worker.sonarr.apiKey.value -}}
  {{- $_ := set $workerEnv "SONARR_API_KEY" .Values.config.worker.sonarr.apiKey.value -}}
{{- end -}}

{{/* MEDIA_MIN_CROP_X / MEDIA_MIN_CROP_Y */}}
{{- $_ := set $workerEnv "MEDIA_MIN_CROP_X" (.Values.config.worker.media.blackBarRemoval.minimumPixels.horizontal | toString) -}}
{{- $_ := set $workerEnv "MEDIA_MIN_CROP_Y" (.Values.config.worker.media.blackBarRemoval.minimumPixels.vertical | toString) -}}

{{/* MEDIA_DETECT_CROP_TIMEOUT */}}
{{- if .Values.config.worker.media.blackBarRemoval.detectTimeout -}}
  {{- $_ := set $workerEnv "MEDIA_DETECT_CROP_TIMEOUT" .Values.config.worker.media.blackBarRemoval.detectTimeout -}}
{{- end -}}

{{/* MEDIA_TRANSCODE_TIMEOUT */}}
{{- if .Values.config.worker.media.transcode.timeout -}}
  {{- $_ := set $workerEnv "MEDIA_TRANSCODE_TIMEOUT" .Values.config.worker.media.transcode.timeout -}}
{{- end -}}

{{/* MEDIA_H265_CRF */}}
{{- if .Values.config.worker.media.transcode.videoQuality -}}
  {{- $_ := set $workerEnv "MEDIA_H265_CRF" (.Values.config.worker.media.transcode.videoQuality | toString) -}}
{{- end -}}

{{/* METRICS_ADDR */}}
{{- if .Values.config.worker.metrics.enabled -}}
  {{- $_ := set $workerEnv "METRICS_ADDR" (printf ":%d" $metricsPort) -}}
{{- end -}}

{{/* OTEL_EXPORTER_OTLP_ENDPOINT */}}
{{- if .Values.config.metrics.otel.endpoint -}}
  {{- $_ := set $workerEnv "OTEL_EXPORTER_OTLP_ENDPOINT" .Values.config.metrics.otel.endpoint -}}
{{- end -}}

{{/* METRICS_HIGH_CARDINALITY_LABELS */}}
{{- if .Values.config.metrics.highCardinalityLabels -}}
  {{- $_ := set $workerEnv "METRICS_HIGH_CARDINALITY_LABELS" "true" -}}
{{- end -}}

{{/* ============================================================ */}}
{{/* Computed persistence                                          */}}
{{/* ============================================================ */}}
{{- $computedPersistence := dict -}}

{{/* Input volume (RO in watcher, RW in worker) */}}
{{- $inputVolBase := omit .Values.config.inputVolume "subPath" -}}
{{- if $inputVolBase -}}
  {{- $watcherMount := dict "path" $inputMountPath "readOnly" true -}}
  {{- $workerMount  := dict "path" $inputMountPath -}}
  {{- if .Values.config.inputVolume.subPath -}}
    {{- $watcherMount = dict "path" $inputMountPath "readOnly" true "subPath" .Values.config.inputVolume.subPath -}}
    {{- $workerMount  = dict "path" $inputMountPath "subPath"  .Values.config.inputVolume.subPath -}}
  {{- end -}}
  {{- $_ := set $inputVolBase "advancedMounts" (dict
    "watcher" (dict "watcher" (list $watcherMount))
    "worker"  (dict "worker"  (list $workerMount))
  ) -}}
  {{- $_ := set $computedPersistence "input" $inputVolBase -}}
{{- end -}}

{{/* Output volume (worker only) */}}
{{- $outputVolBase := omit .Values.config.worker.media.output.volume "subPath" -}}
{{- if $outputVolBase -}}
  {{- $outputMount := dict "path" $outputMountPath -}}
  {{- if .Values.config.worker.media.output.volume.subPath -}}
    {{- $outputMount = dict "path" $outputMountPath "subPath" .Values.config.worker.media.output.volume.subPath -}}
  {{- end -}}
  {{- $_ := set $outputVolBase "advancedMounts" (dict
    "worker" (dict "worker" (list $outputMount))
  ) -}}
  {{- $_ := set $computedPersistence "output" $outputVolBase -}}
{{- end -}}

{{/* Hardware device hostPath (conditional) */}}
{{- if and .Values.config.worker.media.hardware.devicePath .Values.config.worker.media.hardware.mountHostDevice -}}
  {{- $hwMount := dict "path" .Values.config.worker.media.hardware.devicePath -}}
  {{- $_ := set $computedPersistence "hardware-device" (dict
    "type"     "hostPath"
    "hostPath" .Values.config.worker.media.hardware.devicePath
    "advancedMounts" (dict "worker" (dict "worker" (list $hwMount)))
  ) -}}
{{- end -}}

{{/* Watcher config ConfigMap / Secret + persistence */}}
{{- $watcherConfigContent := dict "cronSchedule" .Values.config.watcher.schedule "watches" .Values.config.watcher.watches -}}
{{- $watcherConfigYaml := toYaml $watcherConfigContent -}}

{{- $watcherConfigMount := dict "path" $configMountPath "readOnly" true -}}
{{- $watcherConfigPersistenceBase := dict
  "advancedMounts" (dict "watcher" (dict "watcher" (list $watcherConfigMount)))
-}}

{{- $computedConfigMaps := dict -}}
{{- $computedSecrets    := dict -}}

{{- if eq .Values.config.watcher.configType "Secret" -}}
  {{- $_ := set $computedSecrets "watcher-config" (dict "stringData" (dict "watcher.yaml" $watcherConfigYaml)) -}}
  {{- $configPersistence := mustMergeOverwrite (dict "type" "secret" "identifier" "watcher-config") $watcherConfigPersistenceBase -}}
  {{- $_ := set $computedPersistence "watcher-config" $configPersistence -}}
{{- else if eq .Values.config.watcher.configType "ConfigMap" -}}
  {{- $_ := set $computedConfigMaps "watcher-config" (dict "data" (dict "watcher.yaml" $watcherConfigYaml)) -}}
  {{- $configPersistence := mustMergeOverwrite (dict "type" "configMap" "identifier" "watcher-config") $watcherConfigPersistenceBase -}}
  {{- $_ := set $computedPersistence "watcher-config" $configPersistence -}}
{{- else -}}
  {{- fail (printf "config.watcher.configType must be ConfigMap or Secret, got %q" .Values.config.watcher.configType) -}}
{{- end -}}

{{/* ============================================================ */}}
{{/* Build computed additions (env + persistence only)            */}}
{{/* ============================================================ */}}
{{- $computedAdditions := dict
  "controllers" (dict
    "watcher" (dict "containers" (dict "watcher" (dict "env" $watcherEnv)))
    "worker"  (dict "containers" (dict "worker"  (dict "env" $workerEnv)))
  )
  "persistence" $computedPersistence
-}}
{{- if $computedConfigMaps -}}
  {{- $_ := set $computedAdditions "configMaps" $computedConfigMaps -}}
{{- end -}}
{{- if $computedSecrets -}}
  {{- $_ := set $computedAdditions "secrets" $computedSecrets -}}
{{- end -}}

{{/* ============================================================ */}}
{{/* Deep-merge user resources over computed additions            */}}
{{/* ============================================================ */}}
{{- $mergedResources := mustMergeOverwrite $computedAdditions (mustDeepCopy .Values.resources) -}}

{{/* ============================================================ */}}
{{/* Inject into .Values; strip chart-specific keys               */}}
{{/* ============================================================ */}}
{{- $mergedValues := mustDeepCopy .Values -}}
{{- $mergedValues = omit $mergedValues "config" "resources" -}}
{{- $mergedValues = mustMergeOverwrite $mergedValues $mergedResources -}}
{{- $_ := set . "Values" $mergedValues -}}

{{/* Hand off to the bjw-s common library */}}
{{- include "bjw-s.common.loader.all" . }}
