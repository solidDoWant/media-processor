---
{{/* ============================================================ */}}
{{/* Hard-coded chart internals (not exposed in values)           */}}
{{/* ============================================================ */}}
{{- $configMountPath    := "/etc/media-processor" -}}
{{- $temporalConfigDir  := "/etc/temporal" -}}
{{- $temporalTLSRoot    := "/etc/temporal-tls" -}}
{{- $temporalConfigFile := printf "%s/temporal.toml" $temporalConfigDir -}}

{{/* The container name inside every worker controller. Fixed because controller
   names are operator-defined (workers.<name>) so a stable container name keeps
   per-worker overrides simple — the user always writes
   resources.controllers.<workerName>.containers.main. */}}
{{- $workerContainerName := "main" -}}

{{/* ============================================================ */}}
{{/* Watcher image tag: evaluate tpl strings (e.g. {{ .Chart.AppVersion }}) */}}
{{/* Worker tags are evaluated post-merge per-worker (see below).  */}}
{{/* ============================================================ */}}
{{- $wc := index .Values "resources" "controllers" "watcher" "containers" "watcher" -}}
{{- $_ := set (index $wc "image") "tag" (tpl ((index $wc "image" "tag") | default "" | toString) . | default .Chart.AppVersion) -}}

{{/* ============================================================ */}}
{{/* Workers validation                                            */}}
{{/* ============================================================ */}}
{{/*
The chart treats an empty (or missing) workers map as the default single-
controller layout — one worker named "main" running every activity.

The default lives here in the template (rather than as a populated map in
values.yaml) so a user-supplied workers map fully replaces the default. With
a values.yaml default like `workers: { main: {...} }`, Helm's map deep-merge
would keep "main" alongside any user-defined entries, forcing operators to
write `main: null` to remove it. The empty-by-default + template-fallback
pattern avoids that footgun.
*/}}
{{/* Reject non-map root types explicitly; `| default dict` would otherwise
   coerce `workers: []`, `workers: ""`, etc. to an empty value and silently
   fall into the implicit-main branch. */}}
{{- $rawWorkers := .Values.workers -}}
{{- $workers := dict -}}
{{- if not (kindIs "invalid" $rawWorkers) -}}
  {{- if not (kindIs "map" $rawWorkers) -}}
    {{- fail (printf "workers must be a map (got %s)" (kindOf $rawWorkers)) -}}
  {{- end -}}
  {{- $workers = $rawWorkers -}}
{{- end -}}
{{- if eq (len $workers) 0 -}}
  {{- $workers = dict "main" (dict "activities" (list "all")) -}}
{{- end -}}
{{- $workerNames := keys $workers | sortAlpha -}}
{{- range $name := $workerNames -}}
  {{- $entry := index $workers $name -}}
  {{- if not (kindIs "map" $entry) -}}
    {{- fail (printf "workers.%s must be a map (got %s)" $name (kindOf $entry)) -}}
  {{- end -}}
  {{- $activities := index $entry "activities" -}}
  {{- if not (kindIs "slice" $activities) -}}
    {{- fail (printf "workers.%s.activities must be a list (got %s)" $name (kindOf $activities)) -}}
  {{- end -}}
  {{- if eq (len $activities) 0 -}}
    {{- fail (printf "workers.%s.activities must be a non-empty list" $name) -}}
  {{- end -}}
{{- end -}}

{{/* ============================================================ */}}
{{/* Temporal connection values                                    */}}
{{/* ============================================================ */}}
{{- $temporalAddress   := .Values.config.temporal.address   | default "" -}}
{{- $temporalNamespace := .Values.config.temporal.namespace | default "" -}}
{{- $temporalTaskQueue := .Values.config.temporal.taskQueue | default "" -}}
{{- if not $temporalAddress -}}
  {{- fail "config.temporal.address is required (host:port of the Temporal frontend)" -}}
{{- end -}}
{{- if not $temporalNamespace -}}
  {{- fail "config.temporal.namespace must not be empty (chart default is \"default\")" -}}
{{- end -}}
{{- if not $temporalTaskQueue -}}
  {{- fail "config.temporal.taskQueue must not be empty (chart default is \"media-processor\")" -}}
{{- end -}}

{{/* ============================================================ */}}
{{/* Credential secretKeyRef validation                           */}}
{{/* ============================================================ */}}
{{- $radarrSecretName := .Values.config.worker.radarr.apiKey.secretKeyRef.name | default "" -}}
{{- $radarrSecretKey  := .Values.config.worker.radarr.apiKey.secretKeyRef.key  | default "" -}}
{{- if or (and $radarrSecretName (not $radarrSecretKey)) (and $radarrSecretKey (not $radarrSecretName)) -}}
  {{- fail "config.worker.radarr.apiKey.secretKeyRef.name and config.worker.radarr.apiKey.secretKeyRef.key must both be set when using secretKeyRef" -}}
{{- end -}}

{{- $sonarrSecretName := .Values.config.worker.sonarr.apiKey.secretKeyRef.name | default "" -}}
{{- $sonarrSecretKey  := .Values.config.worker.sonarr.apiKey.secretKeyRef.key  | default "" -}}
{{- if or (and $sonarrSecretName (not $sonarrSecretKey)) (and $sonarrSecretKey (not $sonarrSecretName)) -}}
  {{- fail "config.worker.sonarr.apiKey.secretKeyRef.name and config.worker.sonarr.apiKey.secretKeyRef.key must both be set when using secretKeyRef" -}}
{{- end -}}

{{- $temporalAPIKeyValue      := .Values.config.temporal.apiKey.value             | default "" -}}
{{- $temporalAPIKeySecretName := .Values.config.temporal.apiKey.secretKeyRef.name | default "" -}}
{{- $temporalAPIKeySecretKey  := .Values.config.temporal.apiKey.secretKeyRef.key  | default "" -}}
{{- if or (and $temporalAPIKeySecretName (not $temporalAPIKeySecretKey)) (and $temporalAPIKeySecretKey (not $temporalAPIKeySecretName)) -}}
  {{- fail "config.temporal.apiKey.secretKeyRef.name and config.temporal.apiKey.secretKeyRef.key must both be set when using secretKeyRef" -}}
{{- end -}}
{{- if and $temporalAPIKeyValue $temporalAPIKeySecretName -}}
  {{- fail "config.temporal.apiKey.value and config.temporal.apiKey.secretKeyRef are mutually exclusive — set only one" -}}
{{- end -}}

{{/* config.temporal.keda.apiKey: same shape-validation as the workers' API key
   above (mutual exclusion + paired name/key). The "at least one scaledjob
   controller present + neither populated" gate runs further down, after the
   scaledjob partition is computed. */}}
{{- $kedaAPIKeyValue      := .Values.config.temporal.keda.apiKey.value             | default "" -}}
{{- $kedaAPIKeySecretName := .Values.config.temporal.keda.apiKey.secretKeyRef.name | default "" -}}
{{- $kedaAPIKeySecretKey  := .Values.config.temporal.keda.apiKey.secretKeyRef.key  | default "" -}}
{{- if or (and $kedaAPIKeySecretName (not $kedaAPIKeySecretKey)) (and $kedaAPIKeySecretKey (not $kedaAPIKeySecretName)) -}}
  {{- fail "config.temporal.keda.apiKey.secretKeyRef.name and config.temporal.keda.apiKey.secretKeyRef.key must both be set when using secretKeyRef" -}}
{{- end -}}
{{- if and $kedaAPIKeyValue $kedaAPIKeySecretName -}}
  {{- fail "config.temporal.keda.apiKey.value and config.temporal.keda.apiKey.secretKeyRef are mutually exclusive — set only one" -}}
{{- end -}}

{{/* ============================================================ */}}
{{/* Temporal TLS cert reference resolution                       */}}
{{/* ============================================================ */}}
{{/*
For each present cert reference, compute the file path the chart will mount it at
(<tls-root>/<secret>/<key>) and track unique Secret names so the chart can dedupe
volume mounts. References are only honoured when tls.enabled=true; setting one
otherwise is a config error so a forgotten enabled flag doesn't silently disable
mTLS or CA verification.

clientCertificate points at a kubernetes.io/tls Secret with the standard "tls.crt"
and "tls.key" keys, so a single secretName covers the cert+key pair. caCert is a
free-form secretKeyRef because CA bundles use varying Secret layouts.
*/}}
{{- $temporalTLSEnabled := .Values.config.temporal.tls.enabled -}}
{{- $tlsResolvedPaths := dict -}}
{{- $tlsSecretMounts  := dict -}}

{{- $clientCertSecretName := .Values.config.temporal.tls.clientCertificate.secretName | default "" -}}
{{- if $clientCertSecretName -}}
  {{- if not $temporalTLSEnabled -}}
    {{- fail "config.temporal.tls.clientCertificate.secretName is set but config.temporal.tls.enabled is false — enable TLS or remove the reference" -}}
  {{- end -}}
  {{- $mountDir := printf "%s/%s" $temporalTLSRoot $clientCertSecretName -}}
  {{- $_ := set $tlsResolvedPaths "clientCert" (printf "%s/tls.crt" $mountDir) -}}
  {{- $_ := set $tlsResolvedPaths "clientKey" (printf "%s/tls.key" $mountDir) -}}
  {{- $_ := set $tlsSecretMounts $clientCertSecretName $mountDir -}}
{{- end -}}

{{- $caCertRef := .Values.config.temporal.tls.caCert.secretKeyRef | default dict -}}
{{- $caCertSecretName := $caCertRef.name | default "" -}}
{{- $caCertSecretKey  := $caCertRef.key  | default "" -}}
{{- if $caCertSecretName -}}
  {{- if not $caCertSecretKey -}}
    {{- fail "config.temporal.tls.caCert.secretKeyRef.key must not be empty when name is set (chart default is \"ca.crt\")" -}}
  {{- end -}}
  {{- if not $temporalTLSEnabled -}}
    {{- fail "config.temporal.tls.caCert.secretKeyRef is set but config.temporal.tls.enabled is false — enable TLS or remove the reference" -}}
  {{- end -}}
  {{- $mountDir := printf "%s/%s" $temporalTLSRoot $caCertSecretName -}}
  {{- $_ := set $tlsResolvedPaths "caCert" (printf "%s/%s" $mountDir $caCertSecretKey) -}}
  {{- $_ := set $tlsSecretMounts $caCertSecretName $mountDir -}}
{{- end -}}

{{/* config.temporal.keda.tls: resolved here (rather than inside the scaledjob
   gate below) so shape-validation surfaces immediately on misconfigured
   values, regardless of whether any scaledjob controllers are declared.
   Resolution mirrors the workers' TLS block above; references that have a
   Secret name but no enabled flag fail the same way.
   $kedaTLSEntries is the list of {parameter,name,key} entries that the
   TriggerAuthentication helper consumes; it stays empty when keda.tls is
   disabled or no cert references are configured. */}}
{{- $kedaTLSEnabled := .Values.config.temporal.keda.tls.enabled -}}
{{- $kedaTLSServerName := .Values.config.temporal.keda.tls.serverName | default "" -}}
{{- $kedaTLSDisableHostVerification := .Values.config.temporal.keda.tls.disableHostVerification | default false -}}
{{/* Mirror the cert-ref hard-fail behaviour for the non-secret TLS overrides:
   serverName / disableHostVerification are no-ops when keda.tls.enabled is
   false, which makes a missed enabled flag look valid until KEDA connects
   without the intended TLS posture. Fail at render time instead. */}}
{{- if and (not $kedaTLSEnabled) $kedaTLSServerName -}}
  {{- fail "config.temporal.keda.tls.serverName is set but config.temporal.keda.tls.enabled is false — enable TLS or remove the override" -}}
{{- end -}}
{{- if and (not $kedaTLSEnabled) $kedaTLSDisableHostVerification -}}
  {{- fail "config.temporal.keda.tls.disableHostVerification is set but config.temporal.keda.tls.enabled is false — enable TLS or remove the override" -}}
{{- end -}}
{{- if not $kedaTLSEnabled -}}
  {{- $kedaTLSServerName = "" -}}
  {{- $kedaTLSDisableHostVerification = false -}}
{{- end -}}
{{- $kedaTLSEntries := list -}}

{{- $kedaClientCertSecret := .Values.config.temporal.keda.tls.clientCertificate.secretName | default "" -}}
{{- if $kedaClientCertSecret -}}
  {{- if not $kedaTLSEnabled -}}
    {{- fail "config.temporal.keda.tls.clientCertificate.secretName is set but config.temporal.keda.tls.enabled is false — enable TLS or remove the reference" -}}
  {{- end -}}
  {{- $kedaTLSEntries = append $kedaTLSEntries (dict "parameter" "cert" "name" $kedaClientCertSecret "key" "tls.crt") -}}
  {{- $kedaTLSEntries = append $kedaTLSEntries (dict "parameter" "key"  "name" $kedaClientCertSecret "key" "tls.key") -}}
{{- end -}}

{{- $kedaCACertRef := .Values.config.temporal.keda.tls.caCert.secretKeyRef | default dict -}}
{{- $kedaCACertSecretName := $kedaCACertRef.name | default "" -}}
{{- $kedaCACertSecretKey  := $kedaCACertRef.key  | default "" -}}
{{/* Bidirectional pairing: either both name and key set, or neither.
   Without the reverse check, a key-only override would be silently
   dropped (the outer if gates on name, so the entry never lands in
   secretTargetRef and KEDA loses the CA reference without warning). */}}
{{- if or (and $kedaCACertSecretName (not $kedaCACertSecretKey)) (and $kedaCACertSecretKey (not $kedaCACertSecretName)) -}}
  {{- fail "config.temporal.keda.tls.caCert.secretKeyRef.name and config.temporal.keda.tls.caCert.secretKeyRef.key must both be set when using secretKeyRef" -}}
{{- end -}}
{{- if $kedaCACertSecretName -}}
  {{- if not $kedaTLSEnabled -}}
    {{- fail "config.temporal.keda.tls.caCert.secretKeyRef is set but config.temporal.keda.tls.enabled is false — enable TLS or remove the reference" -}}
  {{- end -}}
  {{- $kedaTLSEntries = append $kedaTLSEntries (dict "parameter" "ca" "name" $kedaCACertSecretName "key" $kedaCACertSecretKey) -}}
{{- end -}}

{{/* ============================================================ */}}
{{/* Watcher env vars                                             */}}
{{/* ============================================================ */}}
{{- $watcherEnv := dict -}}

{{/* TEMPORAL_TASK_QUEUE / TEMPORAL_CONFIG_FILE
   Address, namespace, TLS, and grpc_meta come from the rendered temporal.toml
   pointed to by TEMPORAL_CONFIG_FILE; task queue is not a Temporal client option
   so it stays an env var. */}}
{{- $_ := set $watcherEnv "TEMPORAL_TASK_QUEUE"  $temporalTaskQueue -}}
{{- $_ := set $watcherEnv "TEMPORAL_CONFIG_FILE" $temporalConfigFile -}}

{{/* LOG_LEVEL */}}
{{- $_ := set $watcherEnv "LOG_LEVEL" .Values.config.watcher.logLevel -}}

{{/* METRICS_SCRAPE_WAIT_TIMEOUT */}}
{{- if .Values.config.watcher.metrics.scrapeWaitTimeout -}}
  {{- $_ := set $watcherEnv "METRICS_SCRAPE_WAIT_TIMEOUT" .Values.config.watcher.metrics.scrapeWaitTimeout -}}
{{- end -}}

{{/* WATCHER_TEMPORAL_SEARCH_ATTRIBUTES_ENABLED */}}
{{- if not (kindIs "invalid" .Values.config.watcher.searchAttributes.enabled) -}}
  {{- if not .Values.config.watcher.searchAttributes.enabled -}}
    {{- $_ := set $watcherEnv "WATCHER_TEMPORAL_SEARCH_ATTRIBUTES_ENABLED" "false" -}}
  {{- end -}}
{{- end -}}


{{/* ============================================================ */}}
{{/* Shared worker env vars (same for every worker controller)    */}}
{{/* WORKER_ACTIVITIES is added per-worker below.                 */}}
{{/* ============================================================ */}}
{{- $sharedWorkerEnv := dict -}}

{{/* TEMPORAL_TASK_QUEUE / TEMPORAL_CONFIG_FILE — see watcher block above. */}}
{{- $_ := set $sharedWorkerEnv "TEMPORAL_TASK_QUEUE"  $temporalTaskQueue -}}
{{- $_ := set $sharedWorkerEnv "TEMPORAL_CONFIG_FILE" $temporalConfigFile -}}

{{/* LOG_LEVEL */}}
{{- $_ := set $sharedWorkerEnv "LOG_LEVEL" .Values.config.worker.logLevel -}}

{{/* MEDIA_WEBHOOK_URL */}}
{{- if .Values.config.worker.media.webhookUrl -}}
  {{- $_ := set $sharedWorkerEnv "MEDIA_WEBHOOK_URL" .Values.config.worker.media.webhookUrl -}}
{{- end -}}

{{/* MEDIA_HARDWARE_DEVICE_PATH */}}
{{- if .Values.config.worker.media.hardware.devicePath -}}
  {{- $_ := set $sharedWorkerEnv "MEDIA_HARDWARE_DEVICE_PATH" .Values.config.worker.media.hardware.devicePath -}}
{{- end -}}

{{/* RADARR_URL */}}
{{- if .Values.config.worker.radarr.url -}}
  {{- $_ := set $sharedWorkerEnv "RADARR_URL" .Values.config.worker.radarr.url -}}
{{- end -}}

{{/* RADARR_API_KEY */}}
{{- if $radarrSecretName -}}
  {{- $_ := set $sharedWorkerEnv "RADARR_API_KEY" (dict "valueFrom" (dict "secretKeyRef" (dict "name" $radarrSecretName "key" $radarrSecretKey))) -}}
{{- else if .Values.config.worker.radarr.apiKey.value -}}
  {{- $_ := set $sharedWorkerEnv "RADARR_API_KEY" .Values.config.worker.radarr.apiKey.value -}}
{{- end -}}

{{/* SONARR_URL */}}
{{- if .Values.config.worker.sonarr.url -}}
  {{- $_ := set $sharedWorkerEnv "SONARR_URL" .Values.config.worker.sonarr.url -}}
{{- end -}}

{{/* SONARR_API_KEY */}}
{{- if $sonarrSecretName -}}
  {{- $_ := set $sharedWorkerEnv "SONARR_API_KEY" (dict "valueFrom" (dict "secretKeyRef" (dict "name" $sonarrSecretName "key" $sonarrSecretKey))) -}}
{{- else if .Values.config.worker.sonarr.apiKey.value -}}
  {{- $_ := set $sharedWorkerEnv "SONARR_API_KEY" .Values.config.worker.sonarr.apiKey.value -}}
{{- end -}}

{{/* MEDIA_MIN_CROP_X / MEDIA_MIN_CROP_Y */}}
{{- $_ := set $sharedWorkerEnv "MEDIA_MIN_CROP_X" (.Values.config.worker.media.blackBarRemoval.minimumPixels.horizontal | toString) -}}
{{- $_ := set $sharedWorkerEnv "MEDIA_MIN_CROP_Y" (.Values.config.worker.media.blackBarRemoval.minimumPixels.vertical | toString) -}}

{{/* MEDIA_DETECT_CROP_TIMEOUT */}}
{{- if .Values.config.worker.media.blackBarRemoval.detectTimeout -}}
  {{- $_ := set $sharedWorkerEnv "MEDIA_DETECT_CROP_TIMEOUT" .Values.config.worker.media.blackBarRemoval.detectTimeout -}}
{{- end -}}

{{/* MEDIA_TRANSCODE_TIMEOUT */}}
{{- if .Values.config.worker.media.transcode.timeout -}}
  {{- $_ := set $sharedWorkerEnv "MEDIA_TRANSCODE_TIMEOUT" .Values.config.worker.media.transcode.timeout -}}
{{- end -}}

{{/* MEDIA_PROGRESS_LOG_INTERVAL */}}
{{- if .Values.config.worker.media.transcode.progressLogInterval -}}
  {{- $_ := set $sharedWorkerEnv "MEDIA_PROGRESS_LOG_INTERVAL" .Values.config.worker.media.transcode.progressLogInterval -}}
{{- end -}}

{{/* MEDIA_NOTIFY_* — Temporal RetryPolicy knobs for the Notify activity.
     Use `ne (toString $v) ""` rather than a truthy `if $v` so an operator-
     supplied numeric `0` reaches the binary and fails fast (the binary
     rejects 0 as out-of-range), instead of being silently dropped here as
     a falsy value and falling back to the default. */}}
{{- if .Values.config.worker.media.notify -}}
  {{- $notify := .Values.config.worker.media.notify -}}
  {{- if ne (toString $notify.initialInterval) "" -}}
    {{- $_ := set $sharedWorkerEnv "MEDIA_NOTIFY_INITIAL_INTERVAL" (toString $notify.initialInterval) -}}
  {{- end -}}
  {{- if ne (toString $notify.backoffCoefficient) "" -}}
    {{- $_ := set $sharedWorkerEnv "MEDIA_NOTIFY_BACKOFF_COEFFICIENT" (toString $notify.backoffCoefficient) -}}
  {{- end -}}
  {{- if ne (toString $notify.maximumInterval) "" -}}
    {{- $_ := set $sharedWorkerEnv "MEDIA_NOTIFY_MAXIMUM_INTERVAL" (toString $notify.maximumInterval) -}}
  {{- end -}}
  {{- if ne (toString $notify.maximumAttempts) "" -}}
    {{- $_ := set $sharedWorkerEnv "MEDIA_NOTIFY_MAXIMUM_ATTEMPTS" (toString $notify.maximumAttempts) -}}
  {{- end -}}
{{- end -}}

{{/* WORKER_STOP_TIMEOUT */}}
{{- if .Values.config.worker.stopTimeout -}}
  {{- $_ := set $sharedWorkerEnv "WORKER_STOP_TIMEOUT" .Values.config.worker.stopTimeout -}}
{{- end -}}

{{/* MEDIA_H265_CRF */}}
{{- if .Values.config.worker.media.transcode.videoQuality -}}
  {{- $_ := set $sharedWorkerEnv "MEDIA_H265_CRF" (.Values.config.worker.media.transcode.videoQuality | toString) -}}
{{- end -}}

{{/* METRICS_HIGH_CARDINALITY_LABELS */}}
{{- if .Values.config.worker.metrics.highCardinalityLabels -}}
  {{- $_ := set $sharedWorkerEnv "METRICS_HIGH_CARDINALITY_LABELS" "true" -}}
{{- end -}}

{{/* METRICS_SCRAPE_WAIT_TIMEOUT */}}
{{- if .Values.config.worker.metrics.scrapeWaitTimeout -}}
  {{- $_ := set $sharedWorkerEnv "METRICS_SCRAPE_WAIT_TIMEOUT" .Values.config.worker.metrics.scrapeWaitTimeout -}}
{{- end -}}

{{/* TEMPORAL_API_KEY (watcher + every worker): mirrors the radarr/sonarr pattern.
   Setting this as an env var lets the SDK's env-over-file precedence keep the
   value out of the ConfigMap-rendered TOML. Added to $sharedWorkerEnv so it
   propagates to every worker controller. */}}
{{- if $temporalAPIKeySecretName -}}
  {{- $apiKeyEnvValue := dict "valueFrom" (dict "secretKeyRef" (dict "name" $temporalAPIKeySecretName "key" $temporalAPIKeySecretKey)) -}}
  {{- $_ := set $watcherEnv      "TEMPORAL_API_KEY" $apiKeyEnvValue -}}
  {{- $_ := set $sharedWorkerEnv "TEMPORAL_API_KEY" $apiKeyEnvValue -}}
{{- else if $temporalAPIKeyValue -}}
  {{- $_ := set $watcherEnv      "TEMPORAL_API_KEY" $temporalAPIKeyValue -}}
  {{- $_ := set $sharedWorkerEnv "TEMPORAL_API_KEY" $temporalAPIKeyValue -}}
{{- end -}}

{{/* ============================================================ */}}
{{/* Per-worker env: shared + WORKER_ACTIVITIES                   */}}
{{/* ============================================================ */}}
{{- $workerEnvByName := dict -}}
{{- range $name := $workerNames -}}
  {{- $entry := index $workers $name -}}
  {{- $env := mustDeepCopy $sharedWorkerEnv -}}
  {{- $activitiesList := index $entry "activities" -}}
  {{- $tokens := list -}}
  {{- range $tok := $activitiesList -}}
    {{- $tokens = append $tokens (toString $tok) -}}
  {{- end -}}
  {{- $_ := set $env "WORKER_ACTIVITIES" (join "," $tokens) -}}
  {{- $_ := set $workerEnvByName $name $env -}}
{{- end -}}

{{/* ============================================================ */}}
{{/* Per-worker advancedMounts helper                              */}}
{{/* Returns an advancedMounts subtree (one entry per worker name) */}}
{{/* keyed on worker name → container "main" → list of mounts.    */}}
{{/* ============================================================ */}}
{{- define "media-processor.workersAdvancedMounts" -}}
{{- $names := index . "names" -}}
{{- $mounts := index . "mounts" -}}
{{- $container := index . "container" -}}
{{- $out := dict -}}
{{- range $name := $names -}}
  {{- $_ := set $out $name (dict $container $mounts) -}}
{{- end -}}
{{- toYaml $out -}}
{{- end -}}

{{/* ============================================================ */}}
{{/* Computed persistence                                          */}}
{{/* ============================================================ */}}
{{- $computedPersistence := dict -}}

{{/* ============================================================ */}}
{{/* Per-watch-entry input + output volumes                       */}}
{{/* ============================================================ */}}
{{/*
Each watch entry declares its own `input` and `output` block, both following
the same {volumeName, mountPath, subPath} shape. References resolve against
config.watcher.volumes (a single map of volume definitions). For each
referenced volume the chart computes:
  - watcher-side advancedMounts: read-only mounts of the input refs only
    (the watcher only reads from input volumes; it never touches output
    volumes).
  - worker-side advancedMounts: read-write mounts of input + output refs
    on every worker controller's main container (workers read sources
    from inputs and write results to outputs, plus delete sources when
    preserveSource: false).
Volumes referenced only by outputs end up with no watcher mount entry —
the strip-empty-advancedMounts pass at the end of this template drops them
from .Values when every worker is type: scaledjob, so bjw-s' generate pass
doesn't fall back to mounting them at /<identifier> on the watcher pod.
*/}}
{{- $inputVolMounts := dict -}}
{{- $outputVolMounts := dict -}}
{{- range .Values.config.watcher.watches -}}
  {{- $watchName := index . "name" | default "(unnamed)" -}}
  {{- $input := index . "input" -}}
  {{- if $input -}}
    {{- $volName := index $input "volumeName" | default "" -}}
    {{- $mountPath := index $input "mountPath" | default "" -}}
    {{- $subPath := index $input "subPath" | default "" -}}
    {{- if and (or $mountPath $subPath) (not $volName) -}}
      {{- fail (printf "config.watcher.watches[%q]: input.mountPath/subPath require input.volumeName to be set" $watchName) -}}
    {{- end -}}
    {{- if and $volName (not $mountPath) -}}
      {{- fail (printf "config.watcher.watches[%q]: input.volumeName requires input.mountPath to be set" $watchName) -}}
    {{- end -}}
    {{- if and $mountPath (not (hasPrefix "/" $mountPath)) -}}
      {{- fail (printf "config.watcher.watches[%q]: input.mountPath must be an absolute path, got %q" $watchName $mountPath) -}}
    {{- end -}}
    {{- if $volName -}}
      {{- $mount := dict "path" $mountPath -}}
      {{- if $subPath -}}
        {{- $mount = dict "path" $mountPath "subPath" $subPath -}}
      {{- end -}}
      {{- $volMounts := index $inputVolMounts $volName | default dict -}}
      {{- if hasKey $volMounts $mountPath -}}
        {{- $existingSubPath := index (index $volMounts $mountPath) "subPath" | default "" -}}
        {{- if ne $existingSubPath $subPath -}}
          {{- fail (printf "config.watcher.watches[%q]: conflicting input mount for volumeName %q and mountPath %q: subPath %q conflicts with %q" $watchName $volName $mountPath $existingSubPath $subPath) -}}
        {{- end -}}
      {{- end -}}
      {{- $_ := set $volMounts $mountPath $mount -}}
      {{- $_ := set $inputVolMounts $volName $volMounts -}}
    {{- end -}}
  {{- end -}}
  {{- $output := index . "output" -}}
  {{- if $output -}}
    {{- $volName := index $output "volumeName" | default "" -}}
    {{- $mountPath := index $output "mountPath" | default "" -}}
    {{- $subPath := index $output "subPath" | default "" -}}
    {{- if and (or $mountPath $subPath) (not $volName) -}}
      {{- fail (printf "config.watcher.watches[%q]: output.mountPath/subPath require output.volumeName to be set" $watchName) -}}
    {{- end -}}
    {{- if and $volName (not $mountPath) -}}
      {{- fail (printf "config.watcher.watches[%q]: output.volumeName requires output.mountPath to be set" $watchName) -}}
    {{- end -}}
    {{- if and $mountPath (not (hasPrefix "/" $mountPath)) -}}
      {{- fail (printf "config.watcher.watches[%q]: output.mountPath must be an absolute path, got %q" $watchName $mountPath) -}}
    {{- end -}}
    {{- if $volName -}}
      {{- $mount := dict "path" $mountPath -}}
      {{- if $subPath -}}
        {{- $mount = dict "path" $mountPath "subPath" $subPath -}}
      {{- end -}}
      {{- $volMounts := index $outputVolMounts $volName | default dict -}}
      {{- if hasKey $volMounts $mountPath -}}
        {{- $existingSubPath := index (index $volMounts $mountPath) "subPath" | default "" -}}
        {{- if ne $existingSubPath $subPath -}}
          {{- fail (printf "config.watcher.watches[%q]: conflicting output mount for volumeName %q and mountPath %q: subPath %q conflicts with %q" $watchName $volName $mountPath $existingSubPath $subPath) -}}
        {{- end -}}
      {{- end -}}
      {{- $_ := set $volMounts $mountPath $mount -}}
      {{- $_ := set $outputVolMounts $volName $volMounts -}}
    {{- end -}}
  {{- end -}}
{{- end -}}

{{/* Build the per-volume persistence entries by walking the union of input
   and output volume names. Volumes referenced only by inputs get a watcher
   RO mount entry; volumes referenced only by outputs get worker RW only;
   volumes referenced by both get both. The worker side mounts inputs and
   outputs together (deduped by mountPath, with conflicting subPath
   detection across the input/output split). */}}
{{- $watcherVolumes := .Values.config.watcher.volumes | default dict -}}
{{- $reservedPersistenceKeys := list "watcher-config" "hardware-device" "temporal-config" -}}
{{- $reservedPersistenceKeyPrefixes := list "temporal-tls-" -}}
{{- $allVolNames := dict -}}
{{- range $k, $_ := $inputVolMounts -}}{{- $_ := set $allVolNames $k true -}}{{- end -}}
{{- range $k, $_ := $outputVolMounts -}}{{- $_ := set $allVolNames $k true -}}{{- end -}}
{{- range $volName, $_ := $allVolNames -}}
  {{- if has $volName $reservedPersistenceKeys -}}
    {{- fail (printf "config.watcher.volumes: volume name %q conflicts with a chart-reserved persistence key (reserved: %s)" $volName (join ", " $reservedPersistenceKeys)) -}}
  {{- end -}}
  {{- range $prefix := $reservedPersistenceKeyPrefixes -}}
    {{- if hasPrefix $prefix $volName -}}
      {{- fail (printf "config.watcher.volumes: volume name %q conflicts with a chart-reserved persistence key prefix %q" $volName $prefix) -}}
    {{- end -}}
  {{- end -}}
  {{- if not (hasKey $watcherVolumes $volName) -}}
    {{- fail (printf "config.watcher.watches: input/output volumeName %q not found in config.watcher.volumes" $volName) -}}
  {{- end -}}
  {{- $volBase := mustDeepCopy (index $watcherVolumes $volName) -}}

  {{- /* Watcher RO mounts: input refs only, sorted by mount path for
       deterministic render. Output refs are intentionally absent — the
       watcher does not write to outputs, so granting it visibility would
       only enlarge the attack surface. */ -}}
  {{- $inputForVol := index $inputVolMounts $volName | default dict -}}
  {{- $watcherMounts := list -}}
  {{- range $mp := keys $inputForVol | sortAlpha -}}
    {{- $m := index $inputForVol $mp -}}
    {{- $roMount := merge (dict "readOnly" true) $m -}}
    {{- $watcherMounts = append $watcherMounts $roMount -}}
  {{- end -}}

  {{- /* Worker RW mounts: union of input + output refs, deduped by mount
       path. A subPath conflict between the input and output entries for
       the same mount path is a configuration error — fail render-time
       rather than letting one silently shadow the other. */ -}}
  {{- $workerMountsByPath := dict -}}
  {{- range $mp, $m := $inputForVol -}}
    {{- $_ := set $workerMountsByPath $mp $m -}}
  {{- end -}}
  {{- $outputForVol := index $outputVolMounts $volName | default dict -}}
  {{- range $mp, $m := $outputForVol -}}
    {{- if hasKey $workerMountsByPath $mp -}}
      {{- $existingSub := index (index $workerMountsByPath $mp) "subPath" | default "" -}}
      {{- $newSub := index $m "subPath" | default "" -}}
      {{- if ne $existingSub $newSub -}}
        {{- fail (printf "config.watcher.volumes: volumeName %q has conflicting input/output mounts at %q (input subPath %q vs output subPath %q)" $volName $mp $existingSub $newSub) -}}
      {{- end -}}
    {{- end -}}
    {{- $_ := set $workerMountsByPath $mp $m -}}
  {{- end -}}
  {{- $workerMounts := list -}}
  {{- range $mp := keys $workerMountsByPath | sortAlpha -}}
    {{- $workerMounts = append $workerMounts (index $workerMountsByPath $mp) -}}
  {{- end -}}

  {{- $workerSide := include "media-processor.workersAdvancedMounts" (dict "names" $workerNames "mounts" $workerMounts "container" $workerContainerName) | fromYaml -}}
  {{- $advanced := $workerSide -}}
  {{- if $watcherMounts -}}
    {{- $advanced = mustMergeOverwrite (dict "watcher" (dict "watcher" $watcherMounts)) $workerSide -}}
  {{- end -}}
  {{- $_ := set $volBase "advancedMounts" $advanced -}}
  {{- $_ := set $computedPersistence $volName $volBase -}}
{{- end -}}

{{/* Hardware device hostPath (conditional) */}}
{{- if and .Values.config.worker.media.hardware.devicePath .Values.config.worker.media.hardware.mountHostDevice -}}
  {{- $hwMount := dict "path" .Values.config.worker.media.hardware.devicePath -}}
  {{- $advanced := include "media-processor.workersAdvancedMounts" (dict "names" $workerNames "mounts" (list $hwMount) "container" $workerContainerName) | fromYaml -}}
  {{- $_ := set $computedPersistence "hardware-device" (dict
    "type"     "hostPath"
    "hostPath" .Values.config.worker.media.hardware.devicePath
    "advancedMounts" $advanced
  ) -}}
{{- end -}}

{{/* Watcher config ConfigMap / Secret + persistence */}}
{{/* Build cleaned watches: strip Helm-only input/output fields, inject path
   from mountPath on each side so the binary's YAML config sees only
   {input.path, output.path, output.remotePath} and no chart-internal
   volumeName / mountPath / subPath leakage. */}}
{{- $cleanWatches := list -}}
{{- range .Values.config.watcher.watches -}}
  {{- $entry := mustDeepCopy . -}}
  {{- $watchName := index $entry "name" | default "(unnamed)" -}}
  {{- range $direction := list "input" "output" -}}
    {{- $block := index $entry $direction -}}
    {{- if $block -}}
      {{- $volName := index $block "volumeName" | default "" -}}
      {{- if $volName -}}
        {{- $mountPath := index $block "mountPath" | default "" -}}
        {{- $existingPath := index $block "path" | default "" -}}
        {{- if and $existingPath (ne $existingPath $mountPath) -}}
          {{- fail (printf "config.watcher.watches[%q]: %s.path %q conflicts with %s.mountPath %q; remove %s.path — it is set automatically from mountPath" $watchName $direction $existingPath $direction $mountPath $direction) -}}
        {{- end -}}
        {{- $_ := set $block "path" $mountPath -}}
        {{- $_ := unset $block "volumeName" -}}
        {{- $_ := unset $block "mountPath" -}}
        {{- $_ := unset $block "subPath" -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
  {{- $cleanWatches = append $cleanWatches $entry -}}
{{- end -}}
{{- $watcherConfigContent := dict "watches" $cleanWatches -}}
{{- if .Values.config.watcher.scanInterval -}}
  {{- $_ := set $watcherConfigContent "scanInterval" .Values.config.watcher.scanInterval -}}
{{- end -}}
{{- $watcherConfigYaml := toYaml $watcherConfigContent -}}

{{- $watcherConfigMount := dict "path" $configMountPath "readOnly" true -}}
{{- $watcherConfigPersistenceBase := dict
  "advancedMounts" (dict "watcher" (dict "watcher" (list $watcherConfigMount)))
-}}

{{- $computedConfigMaps := dict -}}
{{- $computedSecrets    := dict -}}

{{- if eq .Values.config.watcher.configType "Secret" -}}
  {{- $_ := set $computedSecrets "watcher-config" (dict "stringData" (dict "watcher.yaml" $watcherConfigYaml)) -}}
  {{- $configPersistence := mustMergeOverwrite (dict "type" "secret" "identifier" "watcher-config") $watcherConfigPersistenceBase -}}
  {{- $_ := set $computedPersistence "watcher-config" $configPersistence -}}
{{- else if eq .Values.config.watcher.configType "ConfigMap" -}}
  {{- $_ := set $computedConfigMaps "watcher-config" (dict "data" (dict "watcher.yaml" $watcherConfigYaml)) -}}
  {{- $configPersistence := mustMergeOverwrite (dict "type" "configMap" "identifier" "watcher-config") $watcherConfigPersistenceBase -}}
  {{- $_ := set $computedPersistence "watcher-config" $configPersistence -}}
{{- else -}}
  {{- fail (printf "config.watcher.configType must be ConfigMap or Secret, got %q" .Values.config.watcher.configType) -}}
{{- end -}}

{{/* ============================================================ */}}
{{/* Temporal client config: temporal.toml ConfigMap, TLS Secret  */}}
{{/* mounts (watcher + every worker)                              */}}
{{/* ============================================================ */}}

{{/* Build the profile dict in camelCase, then snake-case its keys via the helper.
   Pruned: apiKey (sensitive — env var instead), taskQueue (env-only — not a Temporal
   client option), and the Helm-only secretKeyRef wiring (replaced with resolved file
   paths). */}}
{{- $temporalProfile := dict
  "address"   $temporalAddress
  "namespace" $temporalNamespace
-}}
{{/* The [tls] table is always emitted. When enabled is false we set disabled=true
   explicitly, because the SDK auto-enables TLS when an API key is set and the TLS
   config is absent (envconfig client_config.go: `else if c.APIKey != "" { TLS = &tls.Config{} }`).
   Without the explicit disabled=true, `tls.enabled: false` + apiKey would silently
   speak TLS to a plaintext frontend. */}}
{{- $tls := dict -}}
{{- if $temporalTLSEnabled -}}
  {{- if .Values.config.temporal.tls.serverName -}}
    {{- $_ := set $tls "serverName" .Values.config.temporal.tls.serverName -}}
  {{- end -}}
  {{- if .Values.config.temporal.tls.disableHostVerification -}}
    {{- $_ := set $tls "disableHostVerification" true -}}
  {{- end -}}
  {{- if hasKey $tlsResolvedPaths "clientCert" -}}
    {{- $_ := set $tls "clientCertPath" (index $tlsResolvedPaths "clientCert") -}}
  {{- end -}}
  {{- if hasKey $tlsResolvedPaths "clientKey" -}}
    {{- $_ := set $tls "clientKeyPath" (index $tlsResolvedPaths "clientKey") -}}
  {{- end -}}
  {{- if hasKey $tlsResolvedPaths "caCert" -}}
    {{- $_ := set $tls "serverCaCertPath" (index $tlsResolvedPaths "caCert") -}}
  {{- end -}}
{{- else -}}
  {{- $_ := set $tls "disabled" true -}}
{{- end -}}
{{- $_ := set $temporalProfile "tls" $tls -}}

{{- $snakedProfile := include "media-processor.snakeKeys" $temporalProfile | fromYaml -}}

{{/* Attach grpc_meta after recursion so user-supplied header keys are not snake-cased
   (the SDK normalises them on load via NormalizeGRPCMetaKey). */}}
{{- $grpcMeta := .Values.config.temporal.grpcMeta | default dict -}}
{{- if $grpcMeta -}}
  {{- $_ := set $snakedProfile "grpc_meta" $grpcMeta -}}
{{- end -}}

{{- $temporalToml := dict "profile" (dict "default" $snakedProfile) | toToml -}}

{{- $_ := set $computedConfigMaps "temporal-config" (dict "data" (dict "temporal.toml" $temporalToml)) -}}

{{- $temporalConfigMount := dict "path" $temporalConfigDir "readOnly" true -}}
{{- $temporalConfigWorkerSide := include "media-processor.workersAdvancedMounts" (dict "names" $workerNames "mounts" (list $temporalConfigMount) "container" $workerContainerName) | fromYaml -}}
{{- $temporalConfigAdvanced := mustMergeOverwrite (dict "watcher" (dict "watcher" (list $temporalConfigMount))) $temporalConfigWorkerSide -}}
{{- $_ := set $computedPersistence "temporal-config" (dict
  "type" "configMap"
  "identifier" "temporal-config"
  "advancedMounts" $temporalConfigAdvanced
) -}}

{{/* TLS Secret mounts (one per unique Secret name), mounted RO on watcher and
   every worker. Each mount projects the entire Secret as a directory under
   <tls-root>/<secret>/; the TOML references individual keys by full file path. */}}
{{- range $secretName, $mountDir := $tlsSecretMounts -}}
  {{- $persistenceKey := printf "temporal-tls-%s" $secretName -}}
  {{- $tlsMount := dict "path" $mountDir "readOnly" true -}}
  {{- $tlsWorkerSide := include "media-processor.workersAdvancedMounts" (dict "names" $workerNames "mounts" (list $tlsMount) "container" $workerContainerName) | fromYaml -}}
  {{- $tlsAdvanced := mustMergeOverwrite (dict "watcher" (dict "watcher" (list $tlsMount))) $tlsWorkerSide -}}
  {{- $_ := set $computedPersistence $persistenceKey (dict
    "type" "secret"
    "name" $secretName
    "advancedMounts" $tlsAdvanced
  ) -}}
{{- end -}}

{{/* ============================================================ */}}
{{/* Per-worker controller defaults                               */}}
{{/* ============================================================ */}}
{{/*
For each entry in .Values.workers, build a chart-default controller block keyed
on the worker name. The user's resources.controllers.<name> is deep-merged on
top of this default below, so anything they set takes precedence (replicas,
nodeSelector, container resources, additional env, etc.).

Defaults match the pre-multi-worker chart: image (worker repo + AppVersion),
named metrics port :9090, /healthz + /readyz on :8080, hardened securityContext,
PDB enabled when replicas > 1, and 120s terminationGracePeriodSeconds (covers
config.worker.stopTimeout=30s + binary METRICS_SCRAPE_WAIT_TIMEOUT=60s + 30s
buffer; operators running long transcodes must raise this together with
config.worker.stopTimeout and config.worker.metrics.scrapeWaitTimeout).
*/}}
{{- $userControllers := index .Values.resources "controllers" | default dict -}}
{{- $computedWorkerControllers := dict -}}
{{- range $name := $workerNames -}}
  {{- $userCtrl := index $userControllers $name | default dict -}}
  {{- $controllerType := index $userCtrl "type" | default "deployment" -}}

  {{/* PDB default depends on controller type. Deployment-typed defaults gate
     enabled on replicas > 1 and use minAvailable: 1 (the pre-multi-worker
     chart's behaviour). Scaledjob-typed defaults are always enabled with
     maxUnavailable: 0 — replicas is not meaningful for ScaledJob, and a node
     hosting an in-flight transcode should be undrainable until the activity
     completes (or its Temporal heartbeat times out). PDB.enabled is computed
     here as a literal bool rather than a deferred tpl string because
     resources.controllers.<workerName> may be absent in the user values
     entirely (the default case) and chained index on missing keys panics. */}}
  {{- $pdbDefault := dict -}}
  {{- if eq $controllerType "scaledjob" -}}
    {{- $pdbDefault = dict "enabled" true "maxUnavailable" 0 -}}
  {{- else -}}
    {{- $reps := index $userCtrl "replicas" | default 1 -}}
    {{- $pdbDefault = dict "enabled" (gt ($reps | int) 1) "minAvailable" 1 -}}
  {{- end -}}

  {{/* Detect a user-explicit `podDisruptionBudget: null` opt-out before merge.
     mustMergeOverwrite skips nil source values, so a chart default left in
     $controller would silently override `null` and the PDB would still
     emit. Setting podDisruptionBudget on $controller is gated on this flag
     so the merged resource simply has no podDisruptionBudget key in the
     null-opt-out case. */}}
  {{- $userNulledPDB := false -}}
  {{- if hasKey $userCtrl "podDisruptionBudget" -}}
    {{- if kindIs "invalid" (index $userCtrl "podDisruptionBudget") -}}
      {{- $userNulledPDB = true -}}
    {{- end -}}
  {{- end -}}

  {{/* For scaledjob-typed workers, inject the WORKER_IDLE_EXIT_AFTER chart default
     onto the per-worker env dict before merging user values. 5m for activity-only
     workers; 15m for workers whose activities resolve to include the workflow
     token. Resolution mirrors cmd/worker/activities_resolver.go: tokens are
     evaluated left-to-right against an empty set, "all" expands to every known
     token (which includes workflow), "workflow" adds it, "!workflow" removes it.
     User-supplied resources.controllers.<name>.containers.main.env.WORKER_IDLE_EXIT_AFTER
     overrides this default via the resources mustMergeOverwrite below. */}}
  {{- if eq $controllerType "scaledjob" -}}
    {{- $entry := index $workers $name -}}
    {{- $activitiesList := index $entry "activities" -}}
    {{- $includesWorkflow := false -}}
    {{- range $tok := $activitiesList -}}
      {{- $t := toString $tok -}}
      {{- if or (eq $t "all") (eq $t "workflow") -}}
        {{- $includesWorkflow = true -}}
      {{- else if eq $t "!workflow" -}}
        {{- $includesWorkflow = false -}}
      {{- end -}}
    {{- end -}}
    {{- $defaultIdle := ternary "15m" "5m" $includesWorkflow -}}
    {{- $_ := set (index $workerEnvByName $name) "WORKER_IDLE_EXIT_AFTER" $defaultIdle -}}
  {{- end -}}
  {{- $controller := dict
    "strategy" "RollingUpdate"
    "containers" (dict $workerContainerName (dict
      "image" (dict
        "repository" "ghcr.io/soliddowant/media-processor/worker"
        "tag" $.Chart.AppVersion
      )
      "ports" (list (dict
        "name" "metrics"
        "containerPort" 9090
        "protocol" "TCP"
      ))
      "probes" (dict
        "liveness" (dict
          "enabled" true
          "custom" true
          "spec" (dict
            "httpGet" (dict "path" "/healthz" "port" 8080)
            "initialDelaySeconds" 0
            "periodSeconds" 10
            "failureThreshold" 3
          )
        )
        "readiness" (dict
          "enabled" true
          "custom" true
          "spec" (dict
            "httpGet" (dict "path" "/readyz" "port" 8080)
            "initialDelaySeconds" 0
            "periodSeconds" 10
            "failureThreshold" 3
          )
        )
      )
      "securityContext" (dict
        "allowPrivilegeEscalation" false
        "capabilities" (dict "drop" (list "ALL"))
        "readOnlyRootFilesystem" true
        "runAsNonRoot" true
        "runAsUser" 1000
        "runAsGroup" 1000
      )
      "env" (index $workerEnvByName $name)
    ))
    "pod" (dict
      "terminationGracePeriodSeconds" 120
    )
  -}}
  {{- if not $userNulledPDB -}}
    {{- $_ := set $controller "podDisruptionBudget" $pdbDefault -}}
  {{- end -}}
  {{- $_ := set $computedWorkerControllers $name $controller -}}
{{- end -}}

{{/* ============================================================ */}}
{{/* Per-worker PodMonitor                                        */}}
{{/* ============================================================ */}}
{{/*
The worker binary always exposes /metrics on port 9090. The
config.worker.metrics.enabled toggle controls whether the chart emits one
PodMonitor per worker. PodMonitor (not ServiceMonitor) is used because the
worker's activity drain can run for the full WORKER_STOP_TIMEOUT, during
which a ServiceMonitor would lose the pod from Endpoints and miss the
final scrape. The chart drives the PodMonitor selector itself instead of
using `controller.identifier` because scaledjob controllers are stripped
from `.Values.controllers` before bjw-s' generate pass and the podMonitor
class would fail validation when looking them up.
*/}}
{{- $computedPodMonitors := dict -}}
{{- $workerMetricsEnabledTpl := printf "{{ .Values.config.worker.metrics.enabled }}" -}}
{{- range $name := $workerNames -}}
  {{/* Use the worker name as both the podMonitor key and the suffix so the
     bjw-s naming helper (lib/common/_determineResourceNameFromValues.tpl)
     renders a clean `<chart>-<workerName>` name regardless of how many
     workers are defined. With itemCount > 1, identifier is appended; the
     suffix-equals-identifier case suppresses a second appendage. With
     itemCount == 1, identifier is not appended and the suffix supplies the
     final segment. */}}
  {{- $_ := set $computedPodMonitors $name (dict
    "enabled" $workerMetricsEnabledTpl
    "suffix" $name
    "selector" (dict
      "matchLabels" (dict
        "app.kubernetes.io/name" (printf "{{ include \"bjw-s.common.lib.chart.names.name\" $ }}")
        "app.kubernetes.io/instance" "{{ .Release.Name }}"
        "app.kubernetes.io/controller" $name
      )
    )
    "podMetricsEndpoints" (list (dict
      "port" "metrics"
      "interval" "1m"
      "scrapeTimeout" "10s"
    ))
  ) -}}
{{- end -}}

{{/* ============================================================ */}}
{{/* Build computed additions (controllers + persistence +        */}}
{{/* per-worker podMonitors + configMaps + secrets)               */}}
{{/* ============================================================ */}}
{{- $computedControllers := dict "watcher" (dict "containers" (dict "watcher" (dict "env" $watcherEnv))) -}}
{{- range $name, $ctrl := $computedWorkerControllers -}}
  {{- $_ := set $computedControllers $name $ctrl -}}
{{- end -}}

{{- $computedAdditions := dict
  "controllers" $computedControllers
  "persistence" $computedPersistence
  "podMonitor"  $computedPodMonitors
-}}
{{- if $computedConfigMaps -}}
  {{- $_ := set $computedAdditions "configMaps" $computedConfigMaps -}}
{{- end -}}
{{- if $computedSecrets -}}
  {{- $_ := set $computedAdditions "secrets" $computedSecrets -}}
{{- end -}}

{{/* ============================================================ */}}
{{/* Deep-merge user resources over computed additions            */}}
{{/* ============================================================ */}}
{{- $mergedResources := mustMergeOverwrite $computedAdditions (mustDeepCopy .Values.resources) -}}

{{/* ============================================================ */}}
{{/* Controller-type validation + scaledjob partition             */}}
{{/* ============================================================ */}}
{{/*
Allowed controller types are bjw-s 4.6.2's set plus "scaledjob" (rendered by
this chart as a keda.sh/v1alpha1 ScaledJob). Unknown types fail here with a
controller-named message rather than reaching bjw-s, which would emit a less
specific "Not a valid controller.type" without naming the controller.

Scaledjob entries are partitioned aside into $scaledjobControllers (keyed by
controller name, sharing the same dict references that live in
$mergedResources.controllers so subsequent post-merge mutations — image-tag
tpl resolution, enabled-template eval — apply to them too) and stripped from
$mergedResources.controllers below so the bjw-s loader never sees a type it
does not support. The new templates/scaledjob.yaml renders them as ScaledJobs.
*/}}
{{- $allowedControllerTypes := list "deployment" "daemonset" "statefulset" "cronjob" "job" "scaledjob" -}}
{{- $scaledjobControllers := dict -}}
{{- $mergedControllers := index $mergedResources "controllers" -}}
{{- range $name, $ctrl := $mergedControllers -}}
  {{- $type := index $ctrl "type" | default "deployment" -}}
  {{- if not (has $type $allowedControllerTypes) -}}
    {{- fail (printf "resources.controllers.%s.type %q is not a valid controller type (allowed: %s)" $name $type (join ", " $allowedControllerTypes)) -}}
  {{- end -}}
  {{- if eq $type "scaledjob" -}}
    {{- if not (has $name $workerNames) -}}
      {{- fail (printf "resources.controllers.%s has type scaledjob but is not declared in workers" $name) -}}
    {{- end -}}
    {{- $_ := set $scaledjobControllers $name $ctrl -}}
  {{- end -}}
{{- end -}}

{{/* ============================================================ */}}
{{/* Worker image tags: evaluate tpl strings post-merge so user   */}}
{{/* overrides of containers.main.image.tag are honoured.        */}}
{{/* ============================================================ */}}
{{- range $name := $workerNames -}}
  {{- $ctrl := index $mergedResources "controllers" $name -}}
  {{- $containers := index $ctrl "containers" | default dict -}}
  {{- $cnt := index $containers $workerContainerName -}}
  {{- if $cnt -}}
    {{- $img := index $cnt "image" | default dict -}}
    {{- $rawTag := index $img "tag" | default "" | toString -}}
    {{- $resolved := tpl $rawTag $ | default $.Chart.AppVersion -}}
    {{- $_ := set $img "tag" $resolved -}}
    {{- $_ := set $cnt "image" $img -}}
  {{- end -}}
{{- end -}}

{{/* ============================================================ */}}
{{/* Evaluate enabled template strings                            */}}
{{/* podDisruptionBudget: remove key when disabled                */}}
{{/* service / serviceMonitor: convert string to bool for bjw-s  */}}
{{/* ============================================================ */}}
{{- range $ctrl := values (index $mergedResources "controllers") -}}
  {{- $pdb := index $ctrl "podDisruptionBudget" -}}
  {{- if and $pdb (hasKey $pdb "enabled") -}}
    {{- if eq (tpl (get $pdb "enabled" | toString) $) "true" -}}
      {{- $_ := unset $pdb "enabled" -}}
    {{- else -}}
      {{- $_ := unset $ctrl "podDisruptionBudget" -}}
    {{- end -}}
  {{- end -}}
{{- end -}}

{{- range $key := list "service" "serviceMonitor" "podMonitor" -}}
  {{- range $obj := values (index $mergedResources $key | default dict) -}}
    {{- if and (kindIs "map" $obj) (hasKey $obj "enabled") -}}
      {{- $_ := set $obj "enabled" (eq (tpl (get $obj "enabled" | toString) $) "true") -}}
    {{- end -}}
  {{- end -}}
{{- end -}}

{{/* ============================================================ */}}
{{/* Inject into .Values; strip chart-specific keys               */}}
{{/* ============================================================ */}}
{{- $mergedValues := mustDeepCopy .Values -}}
{{- $mergedValues = omit $mergedValues "config" "resources" "workers" -}}
{{- $mergedValues = mustMergeOverwrite $mergedValues $mergedResources -}}
{{- $_ := set . "Values" $mergedValues -}}

{{/* Default global.nameOverride to the release name, matching upstream
   bjw-s app-template. This collapses chart fullname to the release name,
   which is required for the v5 auto-created ServiceAccount: the pod field
   that auto-picks an unowned SA uses the SA dict key (identifier =
   releaseName), but the SA's metadata.name comes from fullname — without
   the override these diverge for arbitrary release names and pods would
   reference a non-existent SA. */}}
{{- if not (dig "global" "nameOverride" "" .Values) -}}
  {{- $globalDefaults := dict "nameOverride" .Release.Name -}}
  {{- $existingGlobal := index .Values "global" | default dict -}}
  {{- $_ := set .Values "global" (mustMergeOverwrite $globalDefaults $existingGlobal) -}}
{{- end -}}

{{/* Run the bjw-s init pass (merges .Values.common over .Values, populating
   .Values.global etc.) before our helper invokes bjw-s.common.lib.chart.names.fullname
   and friends. We split init from generate so the scaledjob render below can
   reuse the post-init bjw-s helpers without bjw-s' generate pass having seen
   the scaledjob entries (those would fail bjw-s' controller-type validation). */}}
{{- include "bjw-s.common.loader.init" . }}

{{/* Render scaledjob controllers (partitioned aside above) as
   keda.sh/v1alpha1 ScaledJob resources, plus the per-release
   TriggerAuthentication that backs every Temporal trigger and (when
   keda.apiKey.value is set) the chart-managed Secret that holds the
   inline credential. Done before stripping the controllers' advancedMounts
   entries so bjw-s.common.lib.pod.field.volumes (called from pod.spec
   inside the helper) still finds the persistence mounts for scaledjob
   workers and produces matching volume / volumeMount YAML in the rendered
   Job pod template.

   Inlined in this template (rather than separate templates/scaledjob.yaml /
   triggerauthentication.yaml files) because Helm does not reliably
   propagate intra-template Values mutations across template files. The
   $scaledjobControllers gate is what keeps the default-values render
   byte-identical to pre-change: with no scaledjob controllers, none of the
   KEDA-related validation, Secret materialisation, or resource emission
   below executes. */}}
{{- /* Filter $scaledjobControllers to those that are actually enabled.
     bjw-s' enabled-template strings ("{{ .Values... }}") are evaluated
     here with the same tpl call media-processor.scaledjob uses, so a
     controller that resolves to enabled: false is excluded. Gating the
     KEDA validation, Secret materialisation, and TriggerAuthentication
     on the filtered set keeps disabled scaledjobs from forcing
     keda.apiKey or emitting orphan resources with no ScaledJob to use them. */ -}}
{{- $enabledScaledjobControllers := dict -}}
{{- range $name, $ctrl := $scaledjobControllers -}}
  {{- $enabled := true -}}
  {{- if hasKey $ctrl "enabled" -}}
    {{- $enabled = eq (tpl (get $ctrl "enabled" | toString) $) "true" -}}
  {{- end -}}
  {{- if $enabled -}}
    {{- $_ := set $enabledScaledjobControllers $name $ctrl -}}
  {{- end -}}
{{- end -}}

{{- if $enabledScaledjobControllers -}}

{{- /* Resolve the Secret backing the KEDA-only API key. Either the operator
     supplied secretKeyRef (use directly) or value (chart materialises a
     Secret below). The "neither populated" case fails here rather than at
     the early shape validation block because it only matters once an
     enabled scaledjob controller exists. */ -}}
{{- $kedaResolvedSecretName := "" -}}
{{- $kedaResolvedSecretKey := "" -}}
{{- if $kedaAPIKeySecretName -}}
  {{- $kedaResolvedSecretName = $kedaAPIKeySecretName -}}
  {{- $kedaResolvedSecretKey = $kedaAPIKeySecretKey -}}
{{- else if $kedaAPIKeyValue -}}
  {{- $kedaResolvedSecretName = printf "%s-keda-temporal-apikey" (include "bjw-s.common.lib.chart.names.fullname" .) -}}
  {{- $kedaResolvedSecretKey = "apiKey" -}}
{{- else -}}
  {{- fail "config.temporal.keda.apiKey is required when at least one type: scaledjob worker is defined; configure config.temporal.keda.apiKey.value or config.temporal.keda.apiKey.secretKeyRef" -}}
{{- end -}}

{{- /* Chart-side mirror of workflows/media/config.go (KnownActivities +
     WorkflowToken). The order here drives the resolved-token output order
     (the resolveActivities helper canonicalises against this list), which
     in turn drives the order of triggers rendered on each ScaledJob. */ -}}
{{- $knownTokens := list "probe" "detect-crop" "transcode" "notify" "cleanup" "notify-failure" "workflow" -}}

{{- /* kedaTLS exposes the scaler-side TLS metadata (tlsServerName /
     unsafeSsl) the Temporal scaler reads from triggerMetadata. Only the
     fields actually configured by the operator survive — the helper
     emits each metadata key conditionally on hasKey. The source values
     are read above the bjw-s init / .Values strip pass, since
     .Values.config does not exist after that. */ -}}
{{- $kedaTLS := dict -}}
{{- if $kedaTLSServerName -}}
  {{- $_ := set $kedaTLS "serverName" $kedaTLSServerName -}}
{{- end -}}
{{- if $kedaTLSDisableHostVerification -}}
  {{- $_ := set $kedaTLS "unsafeSsl" true -}}
{{- end -}}

{{- $authRefName := printf "%s-temporal" (include "bjw-s.common.lib.chart.names.fullname" .) }}
{{- include "media-processor.scaledjob" (dict
    "rootContext" .
    "controllers" $enabledScaledjobControllers
    "temporalEndpoint" $temporalAddress
    "temporalNamespace" $temporalNamespace
    "taskQueuePrefix" $temporalTaskQueue
    "authRefName" $authRefName
    "knownTokens" $knownTokens
    "workersByName" $workers
    "kedaTLS" $kedaTLS
  ) }}
{{ include "media-processor.triggerAuthentication" (dict
    "rootContext" .
    "name" $authRefName
    "apiKeySecret" (dict "name" $kedaResolvedSecretName "key" $kedaResolvedSecretKey)
    "tlsSecrets" $kedaTLSEntries
  ) }}

{{- /* Chart-managed Secret carrying the inline keda.apiKey.value bytes.
     Only emitted when value is set (secretKeyRef path uses the operator's
     existing Secret directly, not a chart-managed copy). Labels mirror
     other chart-emitted resources via bjw-s.common.lib.metadata.allLabels. */ -}}
{{- if $kedaAPIKeyValue }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $kedaResolvedSecretName }}
  namespace: {{ .Release.Namespace }}
  {{- with (include "bjw-s.common.lib.metadata.allLabels" . | fromYaml) }}
  labels:
    {{- range $k, $v := . }}
    {{ $k }}: {{ tpl $v $ | quote }}
    {{- end }}
  {{- end }}
type: Opaque
stringData:
  {{ $kedaResolvedSecretKey }}: {{ $kedaAPIKeyValue | quote }}
{{- end }}

{{- /* Per-controller PodDisruptionBudget. The merged controller dict still
     carries the merged podDisruptionBudget block at this point — the
     post-merge enabled-template strip pass above either deleted the whole
     key (enabled: false opt-out) or stripped just the enabled key
     (enabled: true → live). A user-supplied podDisruptionBudget: null
     was caught pre-merge in the per-worker controller-defaults block above,
     so the merged dict simply has no podDisruptionBudget key in that case
     and the helper invocation is skipped. */ -}}
{{- range $name, $ctrl := $enabledScaledjobControllers }}
{{- $pdb := index $ctrl "podDisruptionBudget" }}
{{- if $pdb }}
{{ include "media-processor.podDisruptionBudget" (dict
    "rootContext" $
    "controllerName" $name
    "pdb" $pdb
  ) }}
{{- end }}
{{- end }}
{{- end -}}

{{/* ============================================================ */}}
{{/* Strip scaledjob controllers + their advancedMounts entries   */}}
{{/* from .Values before handing off to bjw-s' generate pass.     */}}
{{/* Stripping the controllers keeps bjw-s from rendering them as */}}
{{/* Jobs/etc. and from failing controller-type validation;       */}}
{{/* stripping their advancedMounts entries on each persistence   */}}
{{/* item keeps bjw-s.common.lib.chart.validate from failing on   */}}
{{/* "No enabled controller found" for the now-removed names.    */}}
{{/* ============================================================ */}}
{{- $valuesControllers := index .Values "controllers" -}}
{{- $valuesPersistence := index .Values "persistence" | default dict -}}
{{- range $name := keys $scaledjobControllers -}}
  {{- $_ := unset $valuesControllers $name -}}
  {{- range $persistenceValues := values $valuesPersistence -}}
    {{- $advancedMounts := index $persistenceValues "advancedMounts" -}}
    {{- if $advancedMounts -}}
      {{- $_ := unset $advancedMounts $name -}}
    {{- end -}}
  {{- end -}}
{{- end -}}

{{/* Drop persistence items whose advancedMounts dict became empty after the
   scaledjob strip (e.g. chart-built output / hardware-device volumes that are
   only referenced by scaledjob workers). bjw-s' volumes helper treats
   `advancedMounts: {}` the same as "no mount config supplied" and falls back
   to mounting the volume at `/<identifier>` on every container of every
   controller — which would shadow real mount points (e.g. the input volume's
   /media/input ends up under a stray /media mount) and break the watcher pod.
   The persistence item is still consumed by the chart-rendered ScaledJob
   (which uses the pre-strip values via the inline scaledjob helper), so
   dropping it from .Values here only affects the bjw-s generate pass. */}}
{{- range $persistenceKey, $persistenceValues := $valuesPersistence -}}
  {{- if hasKey $persistenceValues "advancedMounts" -}}
    {{- if empty (index $persistenceValues "advancedMounts") -}}
      {{- $_ := unset $valuesPersistence $persistenceKey -}}
    {{- end -}}
  {{- end -}}
{{- end -}}

{{/* Hand off the rest of bjw-s rendering. */}}
{{- include "bjw-s.common.loader.generate" . }}
