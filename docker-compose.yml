services:
  postgres:
    image: postgres:18
    command: postgres -c 'max_connections=1000'
    restart: always
    hostname: postgres
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d temporal -U temporal"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  temporal:
    image: temporalio/auto-setup:1.27
    ports:
      - "7233:7233"
    environment:
      - DB=postgres12_pgx
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "temporal --address $(hostname -i):7233 operator cluster health 2>/dev/null | grep -q SERVING"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  temporal-ui:
    # Dashboard: http://localhost:8233
    image: temporalio/ui:2.34.0
    ports:
      - "8233:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal

volumes:
  temporal_postgres_data:
