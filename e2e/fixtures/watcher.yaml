watches:
  - name: radarr
    path: /tmp/e2e-media-processor/downloads/radarr
    mediaType: movie
    ignorePatterns:
      - \.tmp$
  - name: sonarr
    path: /tmp/e2e-media-processor/downloads/sonarr
    mediaType: show
    ignorePatterns:
      - \.tmp$
  - name: preserve-source
    path: /tmp/e2e-media-processor/downloads/preserve-source
    mediaType: movie
    preserveSource: true
    ignorePatterns:
      - \.tmp$
