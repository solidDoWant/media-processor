services:
  postgres:
    image: postgres:18
    hostname: postgres
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    ports:
      - "5436:5432"
    volumes:
      - e2e_temporal_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  temporal-setup:
    image: temporalio/admin-tools:1.31.0
    restart: "on-failure:6"
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgres
      SQL_PASSWORD: temporal
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh"]
    command: /scripts/setup-postgres.sh
    depends_on:
      postgres:
        condition: service_healthy

  temporal:
    image: temporalio/server:1.31.0
    restart: on-failure
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgres
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "127.0.0.1:17233:7233"
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    depends_on:
      temporal-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 60

  temporal-create-namespace:
    image: temporalio/admin-tools:1.31.0
    restart: "on-failure:5"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      DEFAULT_NAMESPACE: default
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh"]
    command: /scripts/create-namespace.sh
    depends_on:
      temporal:
        condition: service_healthy

  watcher:
    image: watcher:latest
    pull_policy: never
    restart: on-failure
    profiles:
      - app
    # Run as the host user so bind-mounted /tmp directories are writable by
    # the container regardless of the image's baked-in UID.
    user: "${UID}:${GID}"
    ports:
      - "127.0.0.1:19090:9090"
      - "127.0.0.1:19092:9091"
    volumes:
      - /tmp/e2e-media-processor:/tmp/e2e-media-processor
      - ./fixtures/watcher.yaml:/etc/watcher.yaml:ro
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: media-processor-e2e
      METRICS_ADDR: ":9090"
      HEALTH_ADDR: ":9091"
    command: ["--config", "/etc/watcher.yaml"]
    depends_on:
      temporal-create-namespace:
        condition: service_completed_successfully

  # Three worker pools exercise the per-activity task-queue routing introduced
  # in #201: one polls only the workflow queue, one polls only the transcode
  # activity queue, and one polls every other activity queue. Together they
  # cover end-to-end execution while proving each piece is reachable from a
  # different process.
  # All three worker pools idle-exit after 5s of no activity- or workflow-task
  # starts so the e2e suite can observe the KEDA-pattern drain path end-to-end.
  # restart: "no" means an idle exit is not respawned by Docker; the suite
  # asserts each container reaches "exited" status with code 0 in
  # waitForWorkersExited (e2e_test.go). METRICS_SCRAPE_WAIT_TIMEOUT is held at
  # 30s (vs the 60s default) so the post-drain scrape gate is short enough to
  # keep the suite responsive while still leaving room for tests to fetch
  # /metrics in their post-completion assertions before the worker exits.
  worker-workflow:
    image: worker:latest
    pull_policy: never
    restart: "no"
    profiles:
      - app
    user: "${UID}:${GID}"
    cap_add:
      - SYS_NICE
    ports:
      - "127.0.0.1:19091:9090"
      - "127.0.0.1:19093:9091"
    volumes:
      - /dev:/dev
      - /tmp/e2e-media-processor:/tmp/e2e-media-processor
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: media-processor-e2e
      WORKER_ACTIVITIES: workflow
      WORKER_IDLE_EXIT_AFTER: "5s"
      METRICS_SCRAPE_WAIT_TIMEOUT: "30s"
      METRICS_ADDR: ":9090"
      HEALTH_ADDR: ":9091"
      RADARR_URL: http://radarr:7878
      RADARR_API_KEY: e2e-radarr-api-key-e2e
      SONARR_URL: http://sonarr:8989
      SONARR_API_KEY: e2e-sonarr-api-key-e2e
      MEDIA_H265_CRF: "51"
    depends_on:
      temporal-create-namespace:
        condition: service_completed_successfully

  worker-transcode:
    image: worker:latest
    pull_policy: never
    restart: "no"
    profiles:
      - app
    user: "${UID}:${GID}"
    # SYS_NICE is required for set_mempolicy, which FFmpeg and the Intel media
    # stack (iHD/VPL) use for NUMA-aware memory placement. Docker drops this
    # capability by default, producing "set_mempolicy: Operation not permitted".
    cap_add:
      - SYS_NICE
    ports:
      - "127.0.0.1:19094:9090"
      - "127.0.0.1:19095:9091"
    volumes:
      - /dev:/dev
      - /tmp/e2e-media-processor:/tmp/e2e-media-processor
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: media-processor-e2e
      WORKER_ACTIVITIES: transcode
      WORKER_IDLE_EXIT_AFTER: "5s"
      METRICS_SCRAPE_WAIT_TIMEOUT: "30s"
      METRICS_ADDR: ":9090"
      HEALTH_ADDR: ":9091"
      RADARR_URL: http://radarr:7878
      RADARR_API_KEY: e2e-radarr-api-key-e2e
      SONARR_URL: http://sonarr:8989
      SONARR_API_KEY: e2e-sonarr-api-key-e2e
      MEDIA_H265_CRF: "51"
    depends_on:
      temporal-create-namespace:
        condition: service_completed_successfully

  worker-rest:
    image: worker:latest
    pull_policy: never
    restart: "no"
    profiles:
      - app
    user: "${UID}:${GID}"
    cap_add:
      - SYS_NICE
    ports:
      - "127.0.0.1:19096:9090"
      - "127.0.0.1:19097:9091"
    volumes:
      - /dev:/dev
      - /tmp/e2e-media-processor:/tmp/e2e-media-processor
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: media-processor-e2e
      WORKER_ACTIVITIES: all,!workflow,!transcode
      WORKER_IDLE_EXIT_AFTER: "5s"
      METRICS_SCRAPE_WAIT_TIMEOUT: "30s"
      METRICS_ADDR: ":9090"
      HEALTH_ADDR: ":9091"
      RADARR_URL: http://radarr:7878
      RADARR_API_KEY: e2e-radarr-api-key-e2e
      SONARR_URL: http://sonarr:8989
      SONARR_API_KEY: e2e-sonarr-api-key-e2e
      MEDIA_H265_CRF: "51"
    depends_on:
      temporal-create-namespace:
        condition: service_completed_successfully

  radarr:
    image: ghcr.io/home-operations/radarr:6.1.2
    # Run as the host user so volume-mounted directories are owned by the
    # current user and can be cleaned up without requiring elevated privileges.
    user: "${UID}:${GID}"
    environment:
      TZ: UTC
      Radarr__Auth__ApiKey: e2e-radarr-api-key-e2e
    ports:
      - "7878:7878"
    volumes:
      - /tmp/e2e-media-processor/config/radarr:/config
      - /tmp/e2e-media-processor/processed-output/radarr:/downloads
      - /tmp/e2e-media-processor/processed-output/radarr-library:/movies
    extra_hosts:
      - "host.docker.internal:host-gateway"

  sonarr:
    image: ghcr.io/home-operations/sonarr:4.0.17
    # Run as the host user so volume-mounted directories are owned by the
    # current user and can be cleaned up without requiring elevated privileges.
    user: "${UID}:${GID}"
    environment:
      TZ: UTC
      Sonarr__Auth__ApiKey: e2e-sonarr-api-key-e2e
    ports:
      - "8989:8989"
    volumes:
      - /tmp/e2e-media-processor/config/sonarr:/config
      - /tmp/e2e-media-processor/processed-output/sonarr:/downloads
      - /tmp/e2e-media-processor/processed-output/sonarr-library:/tv
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  e2e_temporal_postgres_data:
