services:
  postgres:
    image: postgres:18
    # Hatchet uses PostgreSQL as its message queue (SERVER_MSGQUEUE_KIND=postgres),
    # which requires many concurrent connections for its internal pollers and
    # listeners regardless of active workflow count. The default limit of 100 is
    # too low; 200 is sufficient for a single engine instance.
    command: postgres -c 'max_connections=200'
    hostname: postgres
    environment:
      POSTGRES_USER: hatchet
      POSTGRES_PASSWORD: hatchet
      POSTGRES_DB: hatchet
    ports:
      - "5436:5432"
    volumes:
      - e2e_hatchet_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d hatchet -U hatchet"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  migration:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-migrate:v0.83.25
    command: /hatchet/hatchet-migrate
    environment:
      DATABASE_URL: "postgres://hatchet:hatchet@postgres:5432/hatchet"
    depends_on:
      postgres:
        condition: service_healthy

  setup-config:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-admin:v0.83.25
    command: >
      /hatchet/hatchet-admin quickstart
      --skip certs
      --generated-config-dir /hatchet/config
      --overwrite=false
    environment:
      DATABASE_URL: "postgres://hatchet:hatchet@postgres:5432/hatchet"
      SERVER_MSGQUEUE_KIND: postgres
      SERVER_AUTH_COOKIE_DOMAIN: "localhost:8080"
      SERVER_AUTH_COOKIE_INSECURE: "t"
      SERVER_GRPC_BIND_ADDRESS: "0.0.0.0"
      SERVER_GRPC_INSECURE: "t"
      SERVER_GRPC_BROADCAST_ADDRESS: "localhost:7079"
      SERVER_DEFAULT_ENGINE_VERSION: "V1"
      SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS: "hatchet-engine:7070"
      # Pre-generated keysets — pinned so the static HATCHET_CLIENT_TOKEN below
      # remains valid across fresh deployments. Token expires April 2027.
      SERVER_ENCRYPTION_MASTER_KEYSET: ""
      SERVER_ENCRYPTION_JWT_PRIVATE_KEYSET: ""
      SERVER_ENCRYPTION_JWT_PUBLIC_KEYSET: ""
    volumes:
      - e2e_hatchet_certs:/hatchet/certs
      - e2e_hatchet_config:/hatchet/config
    depends_on:
      migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  hatchet-engine:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-engine:v0.83.25
    command: /hatchet/hatchet-engine --config /hatchet/config
    restart: on-failure
    ports:
      - "7079:7070"
    environment:
      DATABASE_URL: "postgres://hatchet:hatchet@postgres:5432/hatchet"
      SERVER_MSGQUEUE_KIND: postgres
      SERVER_GRPC_BIND_ADDRESS: "0.0.0.0"
      SERVER_GRPC_INSECURE: "t"
      SERVER_ENCRYPTION_MASTER_KEYSET: ""
      SERVER_ENCRYPTION_JWT_PRIVATE_KEYSET: ""
      SERVER_ENCRYPTION_JWT_PUBLIC_KEYSET: ""
    volumes:
      - e2e_hatchet_certs:/hatchet/certs
      - e2e_hatchet_config:/hatchet/config
    depends_on:
      setup-config:
        condition: service_completed_successfully
      migration:
        condition: service_completed_successfully

  watcher:
    image: watcher:latest
    pull_policy: never
    restart: on-failure
    ports:
      - "127.0.0.1:19090:9090"
    volumes:
      - /tmp/e2e-media-processor:/tmp/e2e-media-processor
      - ./fixtures/watcher.yaml:/etc/watcher.yaml:ro
    environment:
      # Static token signed with the pinned keysets above; expires April 2027.
      # The embedded grpc_broadcast_address (localhost:7077) is overridden by
      # HATCHET_CLIENT_HOST_PORT so containers reach the engine correctly.
      HATCHET_CLIENT_TOKEN: "eyJhbGciOiJFUzI1NiIsICJraWQiOiJuVjBMT3cifQ..tXmY8YqFvCmLfYuGAheCQo_fmHBuKS0DM_XXttULdxq4WXjLxBknpSTkXEioHZDjXLwrVlA2ihFtUMU4WQ1UuA"
      HATCHET_CLIENT_TLS_STRATEGY: none
      HATCHET_CLIENT_HOST_PORT: hatchet-engine:7070
      METRICS_ADDR: ":9090"
    command: ["--config", "/etc/watcher.yaml"]
    depends_on:
      hatchet-engine:
        condition: service_started

  worker:
    image: worker:latest
    pull_policy: never
    restart: on-failure
    # SYS_NICE is required for set_mempolicy, which FFmpeg and the Intel media
    # stack (iHD/VPL) use for NUMA-aware memory placement. Docker drops this
    # capability by default, producing "set_mempolicy: Operation not permitted".
    cap_add:
      - SYS_NICE
    ports:
      - "127.0.0.1:19091:9090"
    volumes:
      - /dev:/dev
      - /tmp/e2e-media-processor:/tmp/e2e-media-processor
    environment:
      # Static token signed with the pinned keysets above; expires April 2027.
      # The embedded grpc_broadcast_address (localhost:7077) is overridden by
      # HATCHET_CLIENT_HOST_PORT so containers reach the engine correctly.
      HATCHET_CLIENT_TOKEN: "eyJhbGciOiJFUzI1NiIsICJraWQiOiJuVjBMT3cifQ..tXmY8YqFvCmLfYuGAheCQo_fmHBuKS0DM_XXttULdxq4WXjLxBknpSTkXEioHZDjXLwrVlA2ihFtUMU4WQ1UuA"
      HATCHET_CLIENT_TLS_STRATEGY: none
      HATCHET_CLIENT_HOST_PORT: hatchet-engine:7070
      METRICS_ADDR: ":9090"
      MEDIA_OUTPUT_DIR: /tmp/e2e-media-processor/processed-output
      MEDIA_INPUT_ROOT: /tmp/e2e-media-processor/downloads
      RADARR_URL: http://radarr:7878
      RADARR_API_KEY: e2e-radarr-api-key-e2e
      SONARR_URL: http://sonarr:8989
      SONARR_API_KEY: e2e-sonarr-api-key-e2e
      RADARR_LOCAL_PATH_PREFIX: /tmp/e2e-media-processor/downloads/radarr
      RADARR_REMOTE_PATH_PREFIX: /downloads
      SONARR_LOCAL_PATH_PREFIX: /tmp/e2e-media-processor/downloads/sonarr
      SONARR_REMOTE_PATH_PREFIX: /downloads
      MEDIA_H265_CRF: "51"
    depends_on:
      hatchet-engine:
        condition: service_started

  radarr:
    image: ghcr.io/home-operations/radarr:6.1.2
    # Run as the host user so volume-mounted directories are owned by the
    # current user and can be cleaned up without requiring elevated privileges.
    user: "${UID}:${GID}"
    environment:
      TZ: UTC
      Radarr__Auth__ApiKey: e2e-radarr-api-key-e2e
    ports:
      - "7878:7878"
    volumes:
      - /tmp/e2e-media-processor/config/radarr:/config
      - /tmp/e2e-media-processor/processed-output/radarr:/downloads
      - /tmp/e2e-media-processor/processed-output/radarr-library:/movies
    extra_hosts:
      - "host.docker.internal:host-gateway"

  sonarr:
    image: ghcr.io/home-operations/sonarr:4.0.17
    # Run as the host user so volume-mounted directories are owned by the
    # current user and can be cleaned up without requiring elevated privileges.
    user: "${UID}:${GID}"
    environment:
      TZ: UTC
      Sonarr__Auth__ApiKey: e2e-sonarr-api-key-e2e
    ports:
      - "8989:8989"
    volumes:
      - /tmp/e2e-media-processor/config/sonarr:/config
      - /tmp/e2e-media-processor/processed-output/sonarr:/downloads
      - /tmp/e2e-media-processor/processed-output/sonarr-library:/tv
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  e2e_hatchet_postgres_data:
  e2e_hatchet_config:
  e2e_hatchet_certs:
